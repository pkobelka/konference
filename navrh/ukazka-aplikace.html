<title>Konference Seč 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobilní aplikace – úzký sloupec (max 440px) se spodní lištou záložek; na počítači uprostřed jako telefon. */
:root{
  --bg:#eef2ec; --surface:#ffffff; --surface-2:#f6f8f4; --ink:#1c2a21; --muted:#5d6b62; --line:#dbe3d7;
  --accent:#2f6b3c; --accent-ink:#ffffff; --accent-soft:#e1eedf;
  --water:#1d6a86; --water-soft:#dceef4;
  --warn:#b8701a; --bad:#b0413e; --good:#2f7d46;
  --shadow:0 1px 2px rgba(28,42,33,.06),0 6px 20px rgba(28,42,33,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18211b; --surface-2:#1e2822; --ink:#e4ebe5; --muted:#99a79e; --line:#2a352e;
  --accent:#74c487; --accent-ink:#0f1a12; --accent-soft:#1f3326;
  --water:#62b5d3; --water-soft:#16303a;
  --warn:#e0a24f; --bad:#e17a76; --good:#74c487;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --surface-2:#1e2822; --ink:#e4ebe5; --muted:#99a79e; --line:#2a352e;
  --accent:#74c487; --accent-ink:#0f1a12; --accent-soft:#1f3326;
  --water:#62b5d3; --water-soft:#16303a;
  --warn:#e0a24f; --bad:#e17a76; --good:#74c487;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-inline:16px;padding-block:0 96px}

/* hlavička */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--water-soft);color:var(--water);flex:none}

/* spodní lišta */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* obecné */
.sec{display:flex;flex-direction:column;gap:12px;padding-block:6px 18px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}

/* domů */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero h1{font-size:28px;font-weight:800}
.hero .meta{font-size:14px;opacity:.9}
.hero .count{display:flex;align-items:baseline;gap:6px;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .count b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.hero svg.waves{position:absolute;right:-10px;bottom:-6px;width:180px;opacity:.25}
.news{display:flex;flex-direction:column}
.news article{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:10px}
.news article:first-child{border-top:0;padding-top:2px}
.news time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.news h3{font-size:15px;font-family:var(--f-body);font-weight:700}
.news p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.banner{border-radius:14px;overflow:hidden;position:relative;height:92px;background:var(--surface);box-shadow:var(--shadow);border:0;padding:0;width:100%;text-align:left}
.banner .slide{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:14px;opacity:0;animation:fade 12s infinite}
.banner .slide:nth-child(2){animation-delay:4s}
.banner .slide:nth-child(3){animation-delay:8s}
.banner .tag{position:absolute;top:8px;right:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2}
@keyframes fade{0%,3%{opacity:0}6%,30%{opacity:1}33%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.banner .slide{animation:none}.banner .slide:first-child{opacity:1}}

/* program */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.days button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.days button small{display:block;font-weight:500;font-size:11px}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.slot{display:grid;grid-template-columns:50px 1fr;gap:10px}
.slot .t{font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;padding-top:12px}
.talk{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:4px;border-left:4px solid transparent}
.talk.mine{border-left-color:var(--accent)}
.talk.brk{background:var(--surface-2);box-shadow:none;border:1px solid var(--line)}
.talk h3{font-size:16px}
.talk .who{font-size:13px;color:var(--muted)}
.talk .place{font-size:12px;font-weight:600;color:var(--water)}
.talk .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sponsor{font-size:11px;color:var(--muted)}
.inv{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}

/* partneři */
.cat h2{font-size:18px;margin-bottom:8px}
.logos{display:grid;gap:8px}
.logos.g1{grid-template-columns:1fr}
.logos.g2{grid-template-columns:repeat(2,1fr)}
.logos.g3{grid-template-columns:repeat(3,1fr)}
.logo{border:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.logo .lm{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff}
.logos.g1 .logo{flex-direction:row;padding:16px;gap:14px;text-align:left}
.logos.g1 .logo .lm{width:64px;height:64px;font-size:28px}
.logo span{font-size:13px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.logos.g1 .logo span{font-size:18px;text-align:left}

/* video smyčka v profilu */
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:#0d1410}
.video .vs{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px;padding:16px;opacity:0}
.video.play .vs{animation:fade 9s infinite}
.video.play .vs:nth-child(2){animation-delay:3s}
.video.play .vs:nth-child(3){animation-delay:6s}
.video:not(.play) .vs:first-child{opacity:1}
.video .playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;z-index:2}
.video.play .playbtn{display:none}
@media (prefers-reduced-motion: reduce){.video.play .vs{animation:none}.video.play .vs:first-child{opacity:1}}

/* plánek */
.map svg{width:100%;height:auto;display:block}
.map text{font-family:var(--f-body);font-size:9px;fill:var(--ink);font-weight:600}
.map .lbl-m{fill:var(--muted);font-weight:500;font-size:8px}
.map .stand{cursor:pointer}
.map .stand:hover rect,.map .stand:focus rect{stroke:var(--accent);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* já */
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;font-weight:600}
.form input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px}
.idcard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.idcard h2{font-size:22px}
.code{font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--water)}
canvas.qr{width:84px;height:84px;image-rendering:pixelated;border-radius:6px;background:#fff;padding:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}
.status{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--good);margin-left:4px}
.status.w{background:var(--surface-2);color:var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.org{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.send{display:flex;gap:8px}
.send input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit}

/* spodní panel (sheet) */
.backdrop{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet .close{float:right;border:0;background:var(--surface-2);border-radius:99px;width:32px;height:32px;font-size:18px;line-height:1}
.sheet h2{font-size:20px;margin-bottom:4px;padding-right:40px}
.sheet .body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:600;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.q{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:13px;min-width:44px;font-variant-numeric:tabular-nums}
.vote.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.q p{margin:0;font-size:14px}
.q small{color:var(--muted);font-size:12px}
.onscreen{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--water);color:var(--surface);padding:2px 6px;border-radius:6px;margin-left:4px}
.ad{border:0;width:100%;text-align:left;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:12px;position:relative;min-width:0}
.ad .tag{position:absolute;top:6px;right:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ad b{font-family:var(--f-display);font-size:16px;display:block}
.ad small{color:var(--muted);font-size:12px}
.ads2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ads2 .ad{flex-direction:column;align-items:flex-start;gap:8px}
.tt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tt th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 6px 6px 0}
.tt td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:top}
.tt td:first-child{font-weight:700;white-space:nowrap}
.hotel{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hotel:first-of-type{border-top:0;padding-top:0}
.hotel .hi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent-ink)}
.hotel h3{font-size:16px}
.hotel p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl div{position:relative;padding:0 0 14px 16px}
.tl div::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--water)}
.tl b{font-family:var(--f-display);font-size:15px;color:var(--water);font-variant-numeric:tabular-nums}
.tl p{margin:2px 0 0;font-size:14px}
.splash{position:fixed;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.splash .lm{width:88px;height:88px;border-radius:22px;font-size:40px}
.splash b{font-family:var(--f-display);font-size:24px}
.dayp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;width:100%;text-align:left;color:var(--ink)}
.dayp .lm{width:30px;height:30px;border-radius:8px;font-size:14px}
.byp{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.byp .lm{width:24px;height:24px;border-radius:6px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">S27</div>
      <div style="min-width:0"><b>Konference Seč 2027</b><small>VHOS · 10.–12. května 2027</small></div>
    </div>
    <span class="chip" title="Všechna data jsou smyšlená">Ukázka</span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="Hlavní menu"><div class="in" id="tabs"></div></nav>
<div class="backdrop" id="bd" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="splash" id="splash" role="button" tabindex="0" aria-label="Pokračovat do aplikace">
  <div class="label">Konference Seč 2027</div>
  <div class="lm" style="background:#2f6b3c;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800">A</div>
  <div><span class="muted" style="font-size:13px">Generální partner</span><b style="display:block">Alfa Systems</b></div>
  <span class="muted" style="font-size:12px">Klepněte pro pokračování</span>
</div>

<script>
/* ===== Ukázková data (smyšlená) ===== */
const START = new Date(2027,4,10);
const P = { // partneři
  alfa:{n:"Alfa Systems",k:"generalni",c:"#2f6b3c",d:"Komplexní řešení pro správu provozů. Na konferenci představujeme novou platformu pro sběr a vyhodnocení dat.",st:"Stánek 1",web:"alfa-systems.example",s:["Alfa Systems","Data z provozu na jednom místě","Navštivte stánek č. 1"]},
  beta:{n:"Beta Technik",k:"hlavni",c:"#1d6a86",d:"Servis a údržba technologií, 24/7 pohotovost.",st:"Stánek 2",web:"beta-technik.example",s:["Beta Technik","Servis 24/7","Stánek č. 2"]},
  gama:{n:"Gama Servis",k:"hlavni",c:"#7a4fa0",d:"Projektování a inženýring.",st:"Stánek 3",web:"gama-servis.example",s:["Gama Servis","Od projektu po realizaci","Stánek č. 3"]},
  delta:{n:"Delta Měření",k:"odborny",c:"#b8701a",d:"Měřicí technika a kalibrace.",st:"Stánek 4",web:"delta-mereni.example",s:["Delta Měření","Přesně. Spolehlivě.","Stánek č. 4"]},
  eps:{n:"Epsilon Trade",k:"odborny",c:"#3b7f78",d:"Dodávky materiálu a komponent.",st:"Stánek 5",web:"epsilon-trade.example",s:["Epsilon Trade","Skladem do 48 hodin","Stánek č. 5"]},
  zeta:{n:"Zeta Lab",k:"odborny",c:"#a04848",d:"Akreditovaná laboratoř.",st:"Stánek 6",web:"zeta-lab.example",s:["Zeta Lab","Výsledky do 3 dnů","Stánek č. 6"]},
  eta:{n:"Éta Projekt",k:"odborny",c:"#4f6aa0",d:"Projekční kancelář.",st:"Stánek 7",web:"eta-projekt.example",s:["Éta Projekt","Projekty na klíč","Stánek č. 7"]},
  theta:{n:"Théta Energo",k:"odborny",c:"#6b7d2f",d:"Úspory energie v provozech.",st:"Stánek 8",web:"theta-energo.example",s:["Théta Energo","Ušetřete až 20 %","Stánek č. 8"]},
  iota:{n:"Ióta Soft",k:"odborny",c:"#8a5a12",d:"Software pro evidenci a reporting.",st:"Stánek 9",web:"iota-soft.example",s:["Ióta Soft","Reporting bez Excelu","Stánek č. 9"]},
  kappa:{n:"Kappa Média",k:"medialni",c:"#5d6b62",d:"Odborný časopis.",st:"",web:"kappa-media.example",s:["Kappa Média","Odborný měsíčník","Předplatné za konferenční cenu"]},
  lambda:{n:"Lambda Revue",k:"medialni",c:"#6d5d8a",d:"Zpravodajský portál oboru.",st:"",web:"lambda-revue.example",s:["Lambda Revue","Zprávy z oboru denně","lambda-revue.example"]},
};

function sheetQA(id){

/* QR – jen ilustrační vzor (ne skutečný QR kód) */
function drawQR(c,txt){
  if(!c)return;const x=c.getContext("2d"),n=25;x.fillStyle="#fff";x.fillRect(0,0,n,n);x.fillStyle="#111";
  let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(rnd()<.48)x.fillRect(i,j,1,1);
  for(const [a,b] of [[0,0],[n-7,0],[0,n-7]]){x.fillStyle="#fff";x.fillRect(a,b,7,7);x.fillStyle="#111";x.fillRect(a,b,7,7);x.fillStyle="#fff";x.fillRect(a+1,b+1,5,5);x.fillStyle="#111";x.fillRect(a+2,b+2,3,3)}
}

/* ===== Sheet ===== */
let sheetHandler=null;
function openSheet(html,onClick){const s=$("sheet");s.innerHTML=`<div class="grab"></div><button class="close" id="sclose" aria-label="Zavřít">×</button>`+html;
  s.hidden=false;$("bd").hidden=false;sheetHandler=onClick||null;$("sclose").focus()}
function closeSheet(){$("sheet").hidden=true;$("bd").hidden=true;sheetHandler=null}
$("bd").addEventListener("click",closeSheet);
$("sheet").addEventListener("click",e=>{if(e.target.id==="sclose")return closeSheet();if(sheetHandler)sheetHandler(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".stand")){e.preventDefault();sheetPartner(e.target.dataset.partner)}});

/* ===== Události v obsahu ===== */
$("view").addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-day],[data-rem],[data-qa],[data-partner],#chjidlo,#logout,#fill");if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.day){S.day=t.dataset.day;return render()}
  if(t.dataset.rem)return sheetRem(t.dataset.rem);
  if(t.dataset.qa)return sheetQA(t.dataset.qa);
  if(t.dataset.partner)return sheetPartner(t.dataset.partner);
  if(t.id==="chjidlo")return sheetJidlo();
  if(t.id==="logout"){S.logged=false;store.set("logged",false);return render()}
  if(t.id==="fill"){$("lid").value=ME.id;$("lpin").value=ME.pin}
});
$("view").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="login"){
    const ok=$("lid").value.trim()===ME.id&&$("lpin").value.trim()===ME.pin;
    if(!ok){$("lerr").hidden=false;return}
    S.logged=true;store.set("logged",true);render();toast("Přihlášeno – vítejte, pane Nováku");
  }
  if(e.target.id==="mform"){
    const v=$("min").value.trim();if(!v)return;const d=new Date();
    S.msgs.push({me:1,t:v,d:`${d.getDate()}. ${d.getMonth()+1}. ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`});render();
    toast("Zpráva je u pořadatele (ukázka – nic se neodesílá)");
  }
});

render();
