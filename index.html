<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Konference VHOS</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#005472" />
<link rel="apple-touch-icon" href="ikony/apple-touch-icon-org.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Pořadatel" />
<link rel="icon" href="ikony/favicon-org-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="ikony/favicon-org-64.png" sizes="64x64" type="image/png" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--zelena:#2f6b3c;--zelena-tmava:#234f2d;--svetla:#f4f1ea;--karta:#fff;--ramecek:#e7e2d6;--cervena:#b0413e;--oranzova:#c77d1a;--seda:#888;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--svetla);color:#222;padding:18px 14px 60px;}
.hidden{display:none!important;}
.dropz{display:block;border:2px dashed #b9c7b3;border-radius:12px;padding:18px;text-align:center;color:#556;cursor:pointer;background:#fbfcf9}
.dropz.on{background:#eaf3e6;border-color:var(--zelena)}
a{color:var(--zelena);}
.wrap{max-width:1150px;margin:0 auto;}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.top h1{color:var(--zelena-tmava);font-size:1.45rem;}
.top p{color:#666;font-size:.9rem;margin-top:3px;}
.zpet{font-size:.85rem;text-decoration:none;display:inline-block;margin-bottom:6px;}
.gs{position:relative;flex:1;min-width:220px;max-width:460px;}
.gs input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--ramecek);border-radius:10px;font-size:.95rem;background:#fff;}
.gs::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:.9rem;opacity:.6;}
.gsres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--ramecek);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;max-height:60vh;overflow:auto;}
.gsres .h{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888;padding:8px 12px 4px;}
.gsres .it{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-top:1px solid #f1ede4;}
.gsres .it:hover,.gsres .it.on{background:#eef5ec;}
.gsres .it .s{color:#777;font-size:.8rem;text-align:right;}
.gsres .nic{padding:12px;color:#888;font-size:.88rem;}
.verze{font-size:.72rem;color:#999;background:#fff;border:1px solid var(--ramecek);border-radius:99px;padding:2px 8px;}
.userbox{font-size:.8rem;color:#557;display:flex;gap:8px;align-items:center;}
.btn{border:1px solid var(--zelena);background:var(--zelena);color:#fff;border-radius:8px;padding:8px 14px;font-size:.86rem;font-weight:600;cursor:pointer;}
.btn.ghost{background:#fff;color:var(--zelena);}
.btn.small{padding:5px 10px;font-size:.8rem;}
.btn.red{background:#fff;color:var(--cervena);border-color:var(--cervena);}
.btn:disabled{opacity:.5;cursor:default;}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--ramecek);border-radius:8px;background:#fff;width:100%;}
textarea{min-height:60px;}
label.l{display:block;font-size:.78rem;color:#666;margin:10px 0 3px;font-weight:600;}
/* záložky */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;position:sticky;top:0;background:var(--svetla);padding:8px 0;z-index:5;border-bottom:1px solid var(--ramecek);}
.tab{border:1px solid var(--ramecek);background:#fff;border-radius:999px;padding:7px 14px;font-size:.88rem;cursor:pointer;color:#444;font-weight:600;}
.tab.on{background:var(--zelena);color:#fff;border-color:var(--zelena);}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--cervena);color:#fff;font-size:.72rem;margin-left:4px;text-align:center;}
/* přehled */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;cursor:pointer;}
.kpi .v{font-size:1.8rem;font-weight:700;color:var(--zelena-tmava);}
.kpi .t{font-size:.82rem;color:#666;}
.kpi.bad .v{color:var(--cervena);}
.kpi.warn .v{color:var(--oranzova);}
h2.sek{font-size:1.05rem;color:var(--zelena-tmava);margin:18px 2px 8px;border-bottom:2px solid #dfe6da;padding-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
h2.sek .cnt{font-weight:600;color:#8a9382;font-size:.82rem;}
/* filtry */
.filtry{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-bottom:10px;}
.filtry .search{grid-column:1/-1;}
.lista{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;}
.pocet{font-size:.84rem;color:#777;flex:1;}
/* seznam lidí */
.rows{display:flex;flex-direction:column;gap:6px;}
.row{background:#fff;border:1px solid #eee;border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(110px,1fr) 90px 110px 110px 120px 1fr;gap:8px;align-items:center;cursor:pointer;font-size:.88rem;}
.row:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
.row.head{background:transparent;border:none;cursor:default;font-size:.74rem;color:#888;font-weight:700;padding:0 12px;}
.row.head:hover{box-shadow:none;}
.row .jm{font-weight:700;color:var(--zelena-tmava);}
.row .sub{font-size:.76rem;color:#888;}
.muted{color:#aaa;}
.b{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.72rem;font-weight:700;color:#fff;margin:1px 2px 1px 0;white-space:nowrap;}
.b.o{background:#fff;border:1px solid currentColor;}
.prob{color:var(--cervena);font-size:.78rem;font-weight:600;}
.prob.w{color:var(--oranzova);}
@media (max-width:820px){
  .row{grid-template-columns:1fr 1fr;}
  .row.head{display:none;}
  .row .c-prob{grid-column:1/-1;}
}
/* firmy */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px 14px;cursor:pointer;}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
.card h3{font-size:1rem;color:var(--zelena-tmava);}
.card .sub{font-size:.8rem;color:#777;margin-top:4px;}
/* pokoje */
.patro{margin:8px 0 14px;}
.patro .pt{font-size:.8rem;color:#777;font-weight:700;margin:0 2px 5px;}
.pokoje{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;}
.pokoj{border:1px solid #ddd;border-radius:9px;padding:6px 8px;background:#fff;cursor:pointer;min-height:72px;font-size:.78rem;}
.pokoj .cis{font-weight:800;font-size:.95rem;display:flex;justify-content:space-between;}
.pokoj .typ{font-size:.68rem;color:#888;}
.pokoj .kdo{margin-top:3px;line-height:1.3;}
.pokoj.volny{background:#fff;}
.pokoj.cast{background:#fff8e1;border-color:#f0d58a;}
.pokoj.plny{background:#e8f3e6;border-color:#a9cfa2;}
.pokoj.prist{background:#e3eefa;border-color:#9dbde0;}
.pokoj.pres{background:#fbe5e4;border-color:var(--cervena);}
.legenda{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:#666;margin-bottom:8px;}
.legenda span{display:inline-flex;align-items:center;gap:4px;}
.legenda i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid #ccc;}
/* kontroly */
.chyba{background:#fff;border-left:4px solid var(--cervena);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font-size:.9rem;}
.chyba.w{border-left-color:var(--oranzova);}
.chyba .kdo{font-weight:700;color:var(--zelena-tmava);}
.ok{background:#eef5ec;border:1px solid #cfe3ca;color:#3f6b46;border-radius:10px;padding:12px 14px;}
.stav{background:#eef5ec;border:1px solid #cfe3ca;color:#3f6b46;border-radius:10px;padding:9px 12px;font-size:.85rem;margin:10px 0;}
.stav.bad{background:#fbe5e4;border-color:#e6b3b1;color:var(--cervena);}
/* modál */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;z-index:50;overflow:auto;}
.mbox{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px 20px;position:relative;}
.mbox h2{color:var(--zelena-tmava);font-size:1.25rem;padding-right:30px;}
.mclose{position:absolute;right:12px;top:10px;border:none;background:none;font-size:1.5rem;cursor:pointer;color:#888;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
@media (max-width:560px){.two{grid-template-columns:1fr;}}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{border:1px solid var(--ramecek);background:#fff;border-radius:8px;padding:7px 12px;font-size:.86rem;cursor:pointer;font-weight:600;color:#444;}
.seg button.on{color:#fff;}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.88rem;}
.checks label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;}
.checks input{width:auto;}
.loni{background:#f7f5ef;border-radius:8px;padding:8px 10px;font-size:.8rem;color:#666;margin-top:10px;}
.mfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:16px;}
.msg{font-size:.84rem;color:var(--cervena);margin-top:8px;}
.probbox{margin-top:10px;}
.probbox div{font-size:.84rem;padding:5px 9px;border-radius:7px;margin-bottom:4px;background:#fbe5e4;color:var(--cervena);}
.probbox div.w{background:#fff3dc;color:#8a5a12;}
table.t{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px;}
table.t td,table.t th{padding:6px 6px;border-bottom:1px solid #eee;text-align:left;}
table.t th{font-size:.74rem;color:#888;}
table.t tr.cl{cursor:pointer;}
table.t tr.cl:hover{background:#f7f5ef;}
/* přihlášení */
.login{display:flex;justify-content:center;padding-top:60px;}
.loginbox{background:#fff;border-radius:14px;padding:24px;max-width:400px;width:100%;box-shadow:0 6px 22px rgba(0,0,0,.07);}
.loginbox h2{color:var(--zelena-tmava);margin-bottom:8px;}
.loginbox p{font-size:.88rem;color:#666;margin-bottom:12px;}
.loginbox input{margin-bottom:10px;}
.small2{font-size:.8rem;color:var(--zelena);cursor:pointer;margin-top:10px;text-decoration:underline;}
.nast{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;margin-bottom:12px;}
@media print{
  body{background:#fff;padding:0;}
  .tabs,.top .userbox,.lista .btn,.filtry,.zpet,.noprint{display:none!important;}
  .row,.card,.pokoj{break-inside:avoid;}
}
</style>
</head>
<body>

<div class="login hidden" id="login">
  <div class="loginbox">
    <h2>🎤 Konference VHOS</h2>
    <p style="font-size:.75rem;color:#999;margin-top:-4px">verze <span class="vz"></span></p>
    <p id="loginInfo">Přihlas se pracovním e-mailem (stejně jako do Floriána a Voleb). Přijde ti odkaz, kterým se přihlásíš.</p>
    <input id="email" type="email" placeholder="tvůj e-mail" autocomplete="email" />
    <button class="btn" id="sendLink">Poslat přihlašovací odkaz</button>
    <div class="small2" id="pasteTog">Mám odkaz z e-mailu – vložit ručně</div>
    <div id="pasteWrap" class="hidden" style="margin-top:10px">
      <input id="pasteLink" placeholder="vlož celý odkaz z e-mailu" />
      <button class="btn ghost" id="pasteBtn">Přihlásit vloženým odkazem</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="top">
    <div>
      <h1 id="nazev">🎤 Konference VHOS</h1>
      <p id="podnazev"></p>
    </div>
    <div class="gs noprint"><input id="gsq" placeholder="Hledat člověka, firmu, pokoj, e-mail…  ( / )" autocomplete="off" aria-label="Hledat"><div class="gsres hidden" id="gsres"></div></div>
    <div class="userbox"><span class="verze" title="Verze aplikace">v<span class="vz"></span></span><span id="who"></span><button class="btn ghost small" id="logout">Odhlásit</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div id="stavDat" class="stav hidden"></div>
  <main id="view"></main>
</div>

<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>

<script>
"use strict";
/* ================== FIREBASE (stejný projekt jako Volby / Florián) ================== */
const CFG={apiKey:"AIzaSyBEAhZNxq3REoy1vExIrnNEXlyFXHzP4uI",authDomain:"moje-budky.firebaseapp.com",databaseURL:"https://moje-budky-default-rtdb.firebaseio.com",projectId:"moje-budky",storageBucket:"moje-budky.firebasestorage.app",messagingSenderId:"325649258561",appId:"1:325649258561:web:b5571c3278d98405320ec0"};
firebase.initializeApp(CFG);
const VERZE="1.18 · 14. 10. 2026";     // při každém nasazení zvýšit
const AUTH=firebase.auth(), FDB=firebase.database();
document.querySelectorAll(".vz").forEach(e=>e.textContent=VERZE);
const ROOT="konference2027";           // uzel ve Firebase – data nejsou v repozitáři
const PUB="konference2027_verejne";    // veřejné údaje pro formulář (název, noci, menu)
const PRI="konference2027_prihlasky";  // přihlášky partnerů – každá pod tajným klíčem (odkazem)
const AKTU="konference2027_aktuality"; // zprávy pořadatele pro průvodce (Info, číslo u záložky)
const DOPR="konference2027_doprava"; // zájem o svoz na úterní společenský večer (z průvodce, zapisuje kdokoli, čte jen pořadatel)
const DOT="konference2027_dotazy";     // dotazy k přednáškám z průvodce (q = texty, au = nahrávky, v = +1)
const KAR="konference2027_karty";      // osobní karty účastníků pro průvodce – každá pod tajným klíčem, bez kontaktů
const LOGIN_URL=location.origin+location.pathname;
let USER=null;

/* ================== ČÍSELNÍKY ================== */
const KAT={
  vhos:["VHOS","#2f6b3c"], koncern:["Koncern","#3d6fb6"], ace:["AČE","#6b4fa0"],
  prednasejici:["Přednášející","#b0413e"],
  generalni:["Generální partner","#8a5a12"], hlavni:["Hlavní partner","#c77d1a"], odborny:["Odborný partner","#d9a441"],
  medialni:["Mediální partner","#7a6a55"], vystavujici:["Vystavující","#a0632a"], ywp:["YWP","#3b7f78"], verejnost:["Veřejnost","#5d6b62"], host:["Host","#1f8a8a"], ostatni:["Ostatní","#999"]
};
const FKAT=[["generalni","Generální partneři"],["hlavni","Hlavní partneři"],["odborny","Odborní partneři"],["medialni","Mediální partneři"],["vhos","VHOS"],["koncern","Koncern"],["ace","AČE"],["ostatni","Ostatní (instituce, firmy)"]];
const STAV={ano:["Potvrdil","#2f8a3c"],pozvan:["Pozván","#c77d1a"],nevim:["Nevíme","#888"],ne:["Nejede","#b0413e"]};
const STAV_PORADI=["ano","pozvan","nevim","ne"];
const ZDROJ={web:"Web – e-přihláška (ubytování si rezervují sami v hotelu)",hoste:"Formulář pro hosty (zaslaný odkaz)",partner:"Přihláška partnera",formular:"Přihláška – formulář (Word/PDF)",pozvanka:"Pozvánka (zve pořadatel)",rucne:"Zadáno ručně"};
const POHL={z:"Ž",m:"M"};
const SEKCE={A:"Sekce A",B:"Sekce B",C:"Sekce C – Superior",D:"Sekce D – Depandance"};

/* ================== STAV APLIKACE ================== */
let DB={nastaveni:{},firmy:{},osoby:{},pokoje:{},poznamky:{}};
let LOADED=false;
let VIEW=localGet("konf_view")||"prehled";
const FILTR={q:"",stav:"",kat:"",firma:"",noc:"",pokoj:"",vecere:"",prob:false};
let POKOJ_NOC=""; let POKOJE_VSE=false;   // false = jen moje (žluté) pokoje   // vybraná noc v plánku pokojů
let MODAL_OPEN=false;

function localGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function localSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function $(id){return document.getElementById(id);}
function leKey(email){return String(email||"").trim().toLowerCase().replace(/\./g,",");}
function errMsg(e){return e&&e.message?e.message:String(e);}

/* ================== PŘIHLÁŠENÍ ================== */
function showLogin(msg){$("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginMsg").innerHTML=msg||"";}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");}
$("sendLink").addEventListener("click",()=>{
  const email=($("email").value||"").trim(), out=$("loginMsg");
  if(!email){out.textContent="Vyplň e-mail.";return;}
  out.textContent="Odesílám…";
  AUTH.sendSignInLinkToEmail(email,{url:LOGIN_URL,handleCodeInApp:true}).then(()=>{
    localSet("konf_email",email);
    out.innerHTML="✅ Odkaz poslán na "+esc(email)+". Otevři ho na tomhle zařízení.";
  }).catch(e=>{out.textContent="⚠️ "+errMsg(e);});
});
$("pasteTog").addEventListener("click",()=>$("pasteWrap").classList.toggle("hidden"));
$("pasteBtn").addEventListener("click",()=>{
  const link=($("pasteLink").value||"").trim(), email=($("email").value||"").trim()||localGet("konf_email")||"", out=$("loginMsg");
  if(!link||!AUTH.isSignInWithEmailLink(link)){out.textContent="To nevypadá jako přihlašovací odkaz.";return;}
  if(!email){out.textContent="Vyplň nahoře e-mail, na který odkaz přišel.";return;}
  out.textContent="Přihlašuji…";
  AUTH.signInWithEmailLink(email,link).catch(e=>{out.textContent="⚠️ "+errMsg(e);});
});
$("logout").addEventListener("click",()=>AUTH.signOut());
if(AUTH.isSignInWithEmailLink(location.href)){
  const em=localGet("konf_email")||prompt("Potvrď svůj e-mail pro přihlášení:");
  if(em)AUTH.signInWithEmailLink(em,location.href).then(()=>history.replaceState(null,"",location.pathname)).catch(e=>alert("Přihlášení selhalo: "+errMsg(e)));
}
AUTH.onAuthStateChanged(user=>{
  if(!user){USER=null;showLogin();return;}
  FDB.ref("florian_login_email/"+leKey(user.email)).get().then(s=>{
    if(s.exists()){USER=user;$("who").textContent=user.email;showApp();loadData();loadPrihlasky();loadKarty();loadDotazy();loadAktuality();loadDoprava();}
    else{showLogin("E-mail <b>"+esc(user.email)+"</b> zatím nemá přístup. Ozvi se Petru Kobelkovi (stejný seznam jako Florián).");AUTH.signOut();}
  }).catch(()=>showLogin("Nepodařilo se ověřit přístup, zkus to znovu."));
});

/* ================== HLEDÁNÍ (všude nahoře) ================== */
let GS_SEL=0, GS_ITEMS=[];
function gsHledej(q){
  const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return [];
  const hit=s=>t.every(x=>s.includes(x));
  const os=Object.entries(DB.osoby).filter(([,o])=>hit(norm([jmeno(o),o.jmeno,firmaNazev(o.firma),o.email,o.tel,o.pokoj?pokojLabel(o.pokoj):"",o.poznamka].join(" "))))
    .sort((a,b)=>jmeno(a[1]).localeCompare(jmeno(b[1]),"cs")).slice(0,12)
    .map(([id,o])=>({typ:"osoba",id,t:jmeno(o)+(o.jmeno&&!jmeno(o).includes(o.jmeno)?" "+o.jmeno:""),s:[firmaNazev(o.firma),o.pokoj?"pokoj "+pokojLabel(o.pokoj):(o.kraskov?"Kraskov":hotelSam(o)?"sám v hotelu":""),o.vecere==="slav"?"slavnostní večeře":o.vecere==="ne"?"bez večeře":o.vecere?"jídlo "+o.vecere:""].filter(Boolean).join(" · ")}));
  const fi=Object.entries(DB.firmy).filter(([,f])=>hit(norm(f.nazev))).slice(0,8)
    .map(([id,f])=>{const n=Object.values(DB.osoby).filter(o=>o.firma===id&&o.stav!=="ne").length;return {typ:"firma",id,t:f.nazev,s:((FKAT.find(x=>x[0]===f.kat)||[,""])[1])+" · "+n+" lidí"}});
  const po=Object.entries(DB.pokoje).filter(([id,p])=>hit(norm(pokojLabel(id)+" "+p.cislo))).slice(0,6)

  return os.concat(fi,po);
}

function N(){return DB.nastaveni||{};}
function noci(){return Object.entries(N().noci||{}).sort((a,b)=>(a[1].poradi||0)-(b[1].poradi||0));}
function nocVecere(){const f=noci().find(([,n])=>n.vecere);return f?f[0]:null;}
function nocNazev(id){const n=(N().noci||{})[id];return n?n.nazev:id;}
function menuNazev(k){if(k==="ne")return "nechce";if(k==="slav")return "Slavnostní večeře VHOS";const m=(N().menu||{})[k];return m||("Menu "+k);}
function menuKeys(){return Object.keys(N().menu||{"1":1,"2":1,"3":1}).sort();}
function jmeno(o){const s=((o.prijmeni||"")+" "+(o.jmeno||"")).trim();return s||"(bez jména)";}
function firmaNazev(id){return id&&DB.firmy[id]?DB.firmy[id].nazev:"";}
function spi(o){return Object.keys(o.noci||{}).filter(k=>o.noci[k]&&(N().noci||{})[k]);}
function maVlastni(){return Object.values(DB.pokoje).some(p=>p.vlastni);}
function mujPokoj(id){return !maVlastni()||!!(DB.pokoje[id]||{}).vlastni;}
function pokojLabel(id){const p=DB.pokoje[id];return p?(p.sekce+"-"+p.cislo):id;}
function sortOsoby(ids){return ids.sort((a,b)=>jmeno(DB.osoby[a]).localeCompare(jmeno(DB.osoby[b]),"cs"));}
function badgeStav(s){const st=STAV[s||"nevim"];return `<span class="b" style="background:${st[1]}">${st[0]}</span>`;}
function badgesKat(o){return Object.keys(o.kat||{}).filter(k=>KAT[k]).map(k=>`<span class="b o" style="color:${KAT[k][1]}">${KAT[k][0]}</span>`).join("");}

/* obsazenost pokojů: {pokojId:{nocId:[osobaId]}} – kdo má pokoj bez nocí, počítá se do všech nocí */
// Ubytování si rezervuje sám přes link hotelu Jezerka → pokoj nezná pořadatel. o.ubyt: "ja" | "hotel" | (prázdné = podle zdroje)
function hotelSam(o){return o.ubyt==="hotel"||(!o.ubyt&&(o.zdroj==="web"||(o.kat||{}).verejnost)&&!o.pokoj&&!o.nespi);}   // veřejnost si ubytování řeší sama
function nociPokoje(o){const s=spi(o);return s.length?s:noci().map(([k])=>k);}   // bez zaškrtnutých nocí = všechny
function nocKratce(k){return String(nocNazev(k)).split(/\s+/)[0].slice(0,2);}
// kdo sdílí pokoj s osobou aspoň jednu stejnou noc (pondělí ≠ úterý – ti spolu nespí)
function spolubydlici(id,o,OBS){const r=new Set();for(const n of nociPokoje(o))for(const x of ((OBS[o.pokoj]||{})[n]||[]))if(x!==id)r.add(x);return [...r];}
function obsazenost(){
  const res={}, vse=noci().map(([k])=>k);
  for(const [id,o] of Object.entries(DB.osoby)){
    if(!o.pokoj)continue;
    const nn=spi(o).length?spi(o):vse;
    res[o.pokoj]=res[o.pokoj]||{};
    for(const n of nn){(res[o.pokoj][n]=res[o.pokoj][n]||[]).push(id);}
  }
  return res;
}
function pokojTrida(p,cnt){
  const l=+p.luzka||0, max=l+(+p.pristylky||0);
  if(!cnt)return "volny";
  if(cnt>max)return "pres";
  if(cnt>l)return "prist";
  if(cnt===l)return "plny";
  return "cast";
}

/* ---------- KONTROLY ---------- */
function problemyOsoby(id,o,OBS){
  const p=[], st=o.stav||"nevim", nn=spi(o), nv=nocVecere(), jede=st==="ano";
  const maVecer=o.vecere&&o.vecere!=="ne";
  if(jede&&nn.length&&!o.pokoj&&!o.kraskov&&!hotelSam(o))p.push(["e","Spí na konferenci ("+nn.map(nocNazev).join(", ")+"), ale nemá pokoj"]);
  if(o.kraskov&&o.pokoj)p.push(["w","Bydlí v Kraskově (jen svoz), ale má i pokoj "+pokojLabel(o.pokoj)]);
  if(o.ubyt==="hotel"&&o.pokoj)p.push(["w","Rezervuje si sám v hotelu, ale má přidělený pokoj "+pokojLabel(o.pokoj)]);
  if(jede&&!nn.length&&!o.nespi&&!hotelSam(o))p.push(["w","Potvrdil – není vyplněno, jestli spí (zaškrtni noci, nebo „nespí“)"]);
  if(jede&&nv&&nn.includes(nv)&&!o.vecere)p.push(["e","Spí v noci "+nocNazev(nv)+", ale nemá vybranou večeři"]);
  if(!jede&&o.pokoj)p.push([st==="ne"?"e":"w",(st==="ne"?"Nejede":"Není potvrzený ("+STAV[st][0]+")")+", ale má zajištěný pokoj "+pokojLabel(o.pokoj)]);
  if(!jede&&maVecer)p.push([st==="ne"?"e":"w",(st==="ne"?"Nejede":"Není potvrzený ("+STAV[st][0]+")")+", ale má objednanou večeři"]);
  if(!jede&&nn.length&&st==="ne")p.push(["e","Nejede, ale má zaškrtnuté noci"]);
  if(o.pokoj&&!nn.length)p.push(["w","Má pokoj "+pokojLabel(o.pokoj)+", ale nemá zaškrtnutou žádnou noc"]);
  if(o.pokoj&&!DB.pokoje[o.pokoj])p.push(["e","Pokoj "+o.pokoj+" v hotelu neexistuje"]);
  if(o.pokoj&&DB.pokoje[o.pokoj]&&!mujPokoj(o.pokoj))p.push(["w","Pokoj "+pokojLabel(o.pokoj)+" není mezi mými (žlutými) pokoji – patří veřejnosti"]);
  if(o.pokoj&&OBS&&DB.pokoje[o.pokoj]){
    const pk=DB.pokoje[o.pokoj], max=(+pk.luzka||0)+(+pk.pristylky||0);
    for(const n of Object.keys(OBS[o.pokoj]||{}))if(OBS[o.pokoj][n].length>max){p.push(["e","Pokoj "+pokojLabel(o.pokoj)+" je v noci "+nocNazev(n)+" přeplněný ("+OBS[o.pokoj][n].length+"/"+max+")"]);break;}
    const spolu=spolubydlici(id,o,OBS);
    if(spolu.length){
      if(o.sam)p.push(["e","Chce spát sám, ale v pokoji "+pokojLabel(o.pokoj)+" je i "+spolu.map(x=>jmeno(DB.osoby[x])).join(", ")]);
      else{const s=spolu.filter(x=>DB.osoby[x].sam);if(s.length)p.push(["e","Bydlí s někým, kdo chce spát sám ("+s.map(x=>jmeno(DB.osoby[x])).join(", ")+")"]);}
      if(o.pohlavi){const jine=spolu.filter(x=>DB.osoby[x].pohlavi&&DB.osoby[x].pohlavi!==o.pohlavi);if(jine.length)p.push(["w","Smíšený pokoj "+pokojLabel(o.pokoj)+" – bydlí i "+jine.map(x=>jmeno(DB.osoby[x])+" ("+POHL[DB.osoby[x].pohlavi]+")").join(", ")]);}
      if(o.firma){const jf=spolu.filter(x=>DB.osoby[x].firma&&DB.osoby[x].firma!==o.firma);if(jf.length)p.push(["w","Na pokoji "+pokojLabel(o.pokoj)+" je i jiná firma: "+jf.map(x=>jmeno(DB.osoby[x])+" ("+firmaNazev(DB.osoby[x].firma)+")").join(", ")]);}
    }
  }
  return p;
}
function vsechnyProblemy(){
  const OBS=obsazenost(), out=[];
  for(const id of sortOsoby(Object.keys(DB.osoby))){
    for(const [lvl,msg] of problemyOsoby(id,DB.osoby[id],OBS))out.push({lvl,msg,osoba:id});
  }
  // slavnostní večeře – kapacita
  const v=pocetSlav();
  const mx=+N().vecere_max||0, id=+N().vecere_ideal||0;
  if(mx&&v>mx)out.push({lvl:"e",msg:"Na slavnostní večeři VHOS je "+v+" lidí – víc než maximum "+mx,tab:"vecere"});
  else if(id&&v>id)out.push({lvl:"w",msg:"Na slavnostní večeři VHOS je "+v+" lidí – víc než ideál "+id,tab:"vecere"});
  // nárok firem na ubytování
  const nar=N().narok||{};
  for(const [fid,f] of Object.entries(DB.firmy)){
    const lim=nar[f.kat||""];if(!lim||(!lim.osoby&&!lim.pokoje))continue;
    const lide=Object.values(DB.osoby).filter(o=>o.firma===fid&&o.stav!=="ne"&&o.pokoj&&!o.platiVHOS);
    const pok=new Set(lide.map(o=>o.pokoj)).size;
    if(lim.pokoje&&pok>lim.pokoje)out.push({lvl:"w",msg:f.nazev+" má "+pok+" pokoje – nárok je "+lim.pokoje,tab:"firmy"});
    if(lim.osoby&&lide.length>lim.osoby)out.push({lvl:"w",msg:f.nazev+" má ubytováno "+lide.length+" lidí – nárok je "+lim.osoby,tab:"firmy"});
  }
  // duplicity jmen
  const seen={};
  for(const [i,o] of Object.entries(DB.osoby)){const k=norm(jmeno(o));(seen[k]=seen[k]||[]).push(i);}
  for(const k in seen)if(seen[k].length>1)out.push({lvl:"w",msg:"Stejné jméno je v seznamu "+seen[k].length+"× – "+jmeno(DB.osoby[seen[k][0]])+" (není to duplicita?)",osoba:seen[k][0]});
  out.sort((a,b)=>(a.lvl==="e"?0:1)-(b.lvl==="e"?0:1));
  return out;
}
function pocetVecere(){return Object.values(DB.osoby).filter(o=>o.vecere&&o.vecere!=="ne"&&o.vecere!=="slav"&&(o.stav||"nevim")!=="ne").length;}
function pl(n,a,b,c){return n+" "+(n===1?a:n>=2&&n<=4?b:c);}
function pocetSlav(){return Object.values(DB.osoby).filter(o=>o.vecere==="slav"&&(o.stav||"nevim")!=="ne").length;}

function filtrOsob(){
  const OBS=obsazenost(), q=norm(FILTR.q).split(/\s+/).filter(Boolean), nv=nocVecere();
  return sortOsoby(Object.keys(DB.osoby)).filter(id=>{
    const o=DB.osoby[id];
    if(FILTR.stav&&(o.stav||"nevim")!==FILTR.stav)return false;
    if(FILTR.kat&&!(o.kat||{})[FILTR.kat])return false;
    if(FILTR.firma==="-"&&o.firma)return false;
    if(FILTR.firma&&FILTR.firma!=="-"&&o.firma!==FILTR.firma)return false;
    if(FILTR.noc==="nespi"&&spi(o).length)return false;
    if(FILTR.noc&&FILTR.noc!=="nespi"&&!spi(o).includes(FILTR.noc))return false;
    if(FILTR.pokoj==="ma"&&!o.pokoj)return false;
    if(FILTR.pokoj==="nema"&&o.pokoj)return false;
    if(FILTR.pokoj==="chybi"&&!(spi(o).length&&!o.pokoj&&!o.kraskov&&!hotelSam(o)))return false;
    if(FILTR.pokoj==="hotel"&&!hotelSam(o))return false;
    if(FILTR.pokoj==="kraskov"&&!o.kraskov)return false;
    if(FILTR.pokoj==="vhos"&&!o.platiVHOS)return false;
    if(FILTR.pokoj==="sam"&&!o.sam)return false;
    if(FILTR.vecere==="chybi"&&!(nv&&spi(o).includes(nv)&&!o.vecere))return false;
    if(FILTR.vecere==="ano"&&!(o.vecere&&o.vecere!=="ne"))return false;
    if(FILTR.vecere==="nevybrano"&&o.vecere)return false;
    if(FILTR.vecere&&!["chybi","ano","nevybrano"].includes(FILTR.vecere)&&o.vecere!==FILTR.vecere)return false;
    if(FILTR.prob&&!problemyOsoby(id,o,OBS).length)return false;
    if(q.length){
      const hay=norm([jmeno(o),firmaNazev(o.firma),o.email,o.tel,o.poznamka,o.pozn_partner,o.pokoj?pokojLabel(o.pokoj):""].join(" "));
      if(!q.every(t=>hay.includes(t)))return false;
    }
    return true;
  });
}
function opt(v,t,sel){return `<option value="${esc(v)}"${sel===v?" selected":""}>${esc(t)}</option>`;}
function firmyOptions(sel,extra){
  const byKat={};for(const [id,f] of Object.entries(DB.firmy))(byKat[f.kat||"ostatni"]=byKat[f.kat||"ostatni"]||[]).push(id);
  let h=extra||"";
  for(const [k,t] of FKAT){if(!byKat[k])continue;h+=`<optgroup label="${esc(t)}">`+byKat[k].sort((a,b)=>DB.firmy[a].nazev.localeCompare(DB.firmy[b].nazev,"cs")).map(id=>opt(id,DB.firmy[id].nazev,sel)).join("")+"</optgroup>";}
  return h;
}

function exportCSV(){
  const ids=filtrOsob();
  const rows=[["Příjmení","Jméno","Firma","Kategorie","Stav","Noci","Pokoj","Sám","Platí VHOS","Kraskov","Pohlaví","Zdroj","Večeře","E-mail","Telefon","Poznámka"]];
  for(const id of ids){const o=DB.osoby[id];rows.push([o.prijmeni||"",o.jmeno||"",firmaNazev(o.firma),Object.keys(o.kat||{}).map(k=>KAT[k]?KAT[k][0]:k).join(", "),STAV[o.stav||"nevim"][0],spi(o).map(nocNazev).join(", ")||(o.nespi?"nespí":""),o.pokoj?pokojLabel(o.pokoj):hotelSam(o)?"sám v hotelu":"",o.sam?"ano":"",o.platiVHOS?"ano":"",o.kraskov?"ano":"",POHL[o.pohlavi]||"",ZDROJ[o.zdroj]||"",o.vecere?menuNazev(o.vecere):"",o.email||"",o.tel||"",o.poznamka||""]);}
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  download("konference_lide.csv",csv,"text/csv;charset=utf-8");
}
function download(name,text,type){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- FIRMY ---------- */
function rFirmy(){
  const byKat={};
  for(const [id,f] of Object.entries(DB.firmy))(byKat[f.kat||"ostatni"]=byKat[f.kat||"ostatni"]||[]).push(id);

/* ---------- POKOJE ---------- */
function rPokoje(){
  const nn=noci();
  if(!POKOJ_NOC||!(N().noci||{})[POKOJ_NOC])POKOJ_NOC=nn.length?nn[0][0]:"";
  const OBS=obsazenost();
  const bySek={};
  const VID=Object.keys(DB.pokoje).filter(id=>POKOJE_VSE||mujPokoj(id)), mv=maVlastni();
  for(const id of VID){const p=DB.pokoje[id];const s=p.sekce||"?";(bySek[s]=bySek[s]||{});(bySek[s][p.patro||""]=bySek[s][p.patro||""]||[]).push(id);}
  let volne=0,obs=0,luz=0,pri=0,obsL=0;const castecne=[];
  for(const id of VID.filter(mujPokoj)){const p=DB.pokoje[id],k=((OBS[id]||{})[POKOJ_NOC]||[]),l=+p.luzka||0,x=+p.pristylky||0;k.length?obs++:volne++;luz+=l;pri+=x;obsL+=k.length;
    if(k.length&&k.length<l&&!k.some(i=>DB.osoby[i].sam)){const g=[...new Set(k.map(i=>DB.osoby[i].pohlavi).filter(Boolean))];castecne.push({id,v:l-k.length,x,g,kdo:k});}}
  const volL=Math.max(0,luz-obsL);
  const uvolnene=VID.filter(mujPokoj).filter(id=>!((OBS[id]||{})[POKOJ_NOC]||[]).length&&Object.values(OBS[id]||{}).some(l=>l.length));
  let h=`<div class="lista"><span style="font-size:.88rem">Noc:</span><div class="seg">${nn.map(([k,n])=>`<button class="${k===POKOJ_NOC?"on":""}" style="${k===POKOJ_NOC?"background:var(--zelena);border-color:var(--zelena)":""}" data-noc="${esc(k)}">${esc(n.nazev)}</button>`).join("")}</div>
    <span class="pocet">${mv?"<b>Moje pokoje:</b> ":""}${obs} obsazených · ${volne} volných pokojů · volno <b>${pl(volL,"lůžko","lůžka","lůžek")}</b> z ${luz} (+${pl(pri,"přistýlka","přistýlky","přistýlek")})</span>${mv?`<button class="btn ghost small" id="pvse">${POKOJE_VSE?"Skrýt pokoje veřejnosti":"Zobrazit i pokoje veřejnosti"}</button>`:""}<button class="btn ghost small" id="novyPokoj">+ Pokoj</button></div>
  <div class="legenda"><span><i style="background:#fff"></i>volný</span><span><i style="background:#fff8e1"></i>částečně</span><span><i style="background:#e8f3e6"></i>plný</span><span><i style="background:#e3eefa"></i>s přistýlkou</span><span><i style="background:#fbe5e4"></i>přeplněný</span></div>`;
  if(uvolnene.length)h+=`<details class="nast" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">Pokoje volné v noci ${esc(nocNazev(POKOJ_NOC))}, ale obsazené jinou noc (${uvolnene.length}) – lze použít znovu</summary>
    <table class="t" style="margin-top:8px">${uvolnene.sort((a,b)=>pokojLabel(a).localeCompare(pokojLabel(b),"cs",{numeric:true})).map(id=>{const p=DB.pokoje[id],o=OBS[id]||{};return `<tr class="cl" data-pokoj="${esc(id)}"><td><b>${esc(pokojLabel(id))}</b></td><td>${esc(p.luzka||0)} lůžka volná</td><td class="sub">${noci().filter(([k])=>(o[k]||[]).length).map(([k,n])=>esc(n.nazev)+": "+o[k].map(i=>esc(jmeno(DB.osoby[i]))).join(", ")).join(" · ")}</td></tr>`}).join("")}</table></details>`;
  if(castecne.length)h+=`<details class="nast" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">Volná místa v obsazených pokojích (${pl(castecne.reduce((a,c)=>a+c.v,0),"lůžko","lůžka","lůžek")} v ${pl(castecne.length,"pokoji","pokojích","pokojích")}) – kam ještě někoho přidat</summary>
    <table class="t" style="margin-top:8px">${castecne.sort((a,b)=>pokojLabel(a.id).localeCompare(pokojLabel(b.id),"cs",{numeric:true})).map(c=>`<tr class="cl" data-pokoj="${esc(c.id)}"><td><b>${esc(pokojLabel(c.id))}</b></td><td>${c.v} volné lůžko${c.v>1?"a":""}${c.x?" (+"+c.x+" přist.)":""}</td><td>${c.g.length===1?(c.g[0]==="z"?"pro ženu":"pro muže"):c.g.length>1?"smíšený!":""}</td><td class="sub">${c.kdo.map(i=>esc(jmeno(DB.osoby[i]))+(DB.osoby[i].firma?" – "+esc(firmaNazev(DB.osoby[i].firma)):"")).join(", ")}</td></tr>`).join("")}</table></details>`;
  const patroKey=s=>{const m=String(s).match(/\d+/);return s.includes("přízemí")?0:(m?+m[0]:99);};
  for(const s of Object.keys(bySek).sort()){
    h+=`<h2 class="sek">${esc(SEKCE[s]||("Sekce "+s))}</h2>`;
    for(const pt of Object.keys(bySek[s]).sort((a,b)=>patroKey(b)-patroKey(a))){
      const ids=bySek[s][pt].sort((a,b)=>String(DB.pokoje[a].cislo).localeCompare(String(DB.pokoje[b].cislo),"cs",{numeric:true}));
      h+=`<div class="patro"><div class="pt">${esc(pt)}</div><div class="pokoje">`+ids.map(id=>{

          <div class="typ">${esc(p.typ||"")}</div>
          <div class="kdo">${kdo.map(i=>{const o=DB.osoby[i];return (o.sam?"👤 ":"")+esc(jmeno(o))+(o.pohlavi?' <span style="color:#888;font-size:.7rem">'+POHL[o.pohlavi]+"</span>":"")+(o.stav!=="ano"?' <span class="prob">⚠</span>':"");}).join("<br>")}</div></div>`;
      }).join("")+`</div></div>`;
    }
  }
  $("view").innerHTML=h;
  document.querySelectorAll("[data-noc]").forEach(b=>b.addEventListener("click",()=>{POKOJ_NOC=b.dataset.noc;rPokoje();}));
  $("novyPokoj").addEventListener("click",()=>openPokoj(null));
  if($("pvse"))$("pvse").addEventListener("click",()=>{POKOJE_VSE=!POKOJE_VSE;rPokoje();});
}

/* ---------- VEČEŘE ---------- */

/* ---------- KONTROLY ---------- */
function rKontroly(pr){

async function pdfRadky(pdfjs,data){
  const doc=await pdfjs.getDocument({data}).promise, out=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i), tc=await pg.getTextContent(), rows=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,it:[]};rows.push(r);}r.it.push({x,w:it.width,s:it.str});}
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){r.it.sort((a,b)=>a.x-b.x);let line="",end=null;
      for(const t of r.it){if(end!==null){const gap=t.x-end;line+=gap>12?"   ":gap>1.5?" ":"";}line+=t.s;end=t.x+t.w;}
      out.push(line.replace(/\s+$/,""));}
  }
  return out;
}
const TITULY_PRED=/^(prof|doc|ing|mgr|bc|rndr|mudr|judr|phdr|paedr|ing\.\s*arch|dr|mga|mvdr|pharmdr|thdr)\.?/i;

function parsujPrihlasku(L){
  const T=L.join("\n"), g=(re)=>{const m=re.exec(T);return m?m[1].trim():"";};
  const r={objednavka:g(/Přihláška na konferenci\s*-\s*(\d+)/),firma:g(/Název společnosti\s{2,}(.+)/),ico:g(/\bIČ\s{2,}(\d{6,10})/),dic:g(/DIČ\s{2,}(\S+)/),
    kontakt:{jmeno:"",email:"",tel:""},osoby:[],poznamka:""};
  const ki=L.findIndex(l=>/^\s*Kontaktní osoba\s*$/.test(l)), pi=L.findIndex(l=>/Přihlášené osoby/.test(l));
  if(ki>=0)for(const l of L.slice(ki,pi>0?pi:ki+8)){let m;if(m=/Jméno a příjmení\s{2,}(.+)/.exec(l))r.kontakt.jmeno=m[1].trim();if(m=/E-mail\s{2,}(\S+@\S+)/.exec(l))r.kontakt.email=m[1].trim();if(m=/Telefon\s{2,}(.+)/.exec(l))r.kontakt.tel=m[1].trim();}
  const pz=L.findIndex(l=>/^\s*Poznámka:/.test(l));
  if(pz>=0){let t=L[pz].replace(/^\s*Poznámka:\s*/,"");for(const l of L.slice(pz+1)){if(/Cena celkem/.test(l))break;t+=" "+l.trim();}r.poznamka=t.trim();}
  const blok=L.slice(pi>=0?pi:0,pz>=0?pz:L.length), cl=[];
  for(const l of blok){const m=/^\s*(\d+)\.\s+(.+)$/.exec(l);if(m&&/@/.test(m[2])){
      const em=/[^\s@]+@[^\s@]+\.[a-z]{2,}/i.exec(m[2]), pre=m[2].slice(0,em.index), post=m[2].slice(em.index+em[0].length);
      const pred=pre.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean);let tp="",tz="",nm="";
      if(pred.length>=2&&TITULY_PRED.test(pred[0]))tp=pred.shift();
      if(pred.length>=2&&TITULY_ZA.test(pred[pred.length-1]))tz=pred.pop();
      nm=pred.join(" ");
      if(!tp){const mm=/^((?:(?:prof|doc|ing|mgr|bc|rndr|mudr|judr|phdr|dr)\.\s*)+)(.+)$/i.exec(nm);if(mm){tp=mm[1].trim();nm=mm[2];}}
      if(!tz){const mm=/^(.+?)[,\s]+((?:ph\.?\s*d\.?|csc\.?|drsc\.?|mba|dis\.?|ll\.?m\.?|msc\.?)(?:[,\s]+.*)?)$/i.exec(nm);if(mm){nm=mm[1];tz=mm[2].trim();}}
      const w=nm.trim().split(/\s+/);r.osoby.push({titul_pred:tp,titul_za:tz,jmeno:w.slice(0,-1).join(" "),prijmeni:w[w.length-1]||"",email:em[0],tel:post.trim().replace(/\s{2,}.*$/,"")});}
    const c=/(?:^|\s)(nečlen|člen)(?=\s|$)/i.exec(l);if(c)cl.push(/nečlen/i.test(c[1])?"nečlen":"člen");
  }

}

async function docxRadky(JSZip,data){

  const d=new DOMParser().parseFromString(xml,"application/xml"), NS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const t=el=>Array.from(el.getElementsByTagNameNS(NS,"t")).map(x=>x.textContent).join("").trim();
  const body=d.getElementsByTagNameNS(NS,"body")[0], out=[];
  const kids=n=>Array.from({length:n.childNodes.length},(_,i)=>n.childNodes[i]).filter(x=>x.nodeType===1);
  for(const el of kids(body)){
    if(el.localName==="p"){const s=t(el);if(s)out.push([s]);}

const FTYP=[[/PRO\s+PŘEDNÁŠEJÍCÍ/i,"prednasejici","Přednášející"],[/VYSTAVUJÍCÍ|VYSTAVOVATEL/i,"vystavujici","Vystavující"],[/YWP/i,"ywp","YWP"],[/\bHOST(É|E|Ů)?\b/i,"host","Host"]];

    for(let i=0;i<cells.length;i++){
      const m=/^([^:]{2,40}):\s*(.*)$/.exec(cells[i]);if(!m)continue;
      let val=m[2];if(!val&&i+1<cells.length&&!/^[^:]{2,40}:/.test(cells[i+1])){val=cells[i+1];i++;}
      zpracuj(m[1],val);
    }
  }
  dalsi();
  // kontakt firmy u vystavovatele = firemní e-mail/tel, jinak první osoba
  return r;
}
// Jeden soubor → společný tvar {druh:"web"|"form", typ, firma, ico, dic, kontakt, osoby, poznamka, …}
function prectiSoubor(fl){
  const docx=/\.docx$/i.test(fl.name);
  if(/\.doc$/i.test(fl.name))return Promise.reject(new Error("starý formát .doc – ulož ho ve Wordu jako .docx nebo PDF"));
  return fl.arrayBuffer().then(b=>docx
    ? nactiJszip().then(jz=>docxRadky(jz,b)).then(rows=>formNaZaznam(parsujFormular(rows)))
    : nactiPdfjs().then(pj=>pdfRadky(pj,new Uint8Array(b))).then(L=>/Přihláška na konferenci\s*-\s*\d+/.test(L.join("\n"))
        ? Object.assign(parsujPrihlasku(L),{druh:"web"})
        : formNaZaznam(parsujFormular(L.map(l=>[l])))));
}
function anoNe(v){v=String(v||"").trim();if(/^(ano|a|y|yes|x|✓|✔|1)\b/i.test(v))return true;if(/^(ne|n|no|0|-|–)(\b|$)/i.test(v))return false;return null;}
function formNaZaznam(f){
  const o0=f.osoby[0]||{};
  return Object.assign(f,{druh:"form",kontakt:{jmeno:[o0.jmeno,o0.prijmeni].filter(Boolean).join(" "),email:f.f_email||o0.email||"",tel:f.f_tel||o0.tel||""}});
}
function firmaPodle(r){const ico=String(r.ico||"").replace(/\D/g,"");
  return Object.keys(DB.firmy).find(f=>ico&&String(DB.firmy[f].ico||"").replace(/\D/g,"")===ico)||Object.keys(DB.firmy).find(f=>norm(DB.firmy[f].nazev)===norm(r.firma))||"";}
function osobaPodle(x){const e=norm(x.email);return Object.keys(DB.osoby).find(i=>e&&norm(DB.osoby[i].email)===e)||Object.keys(DB.osoby).find(i=>norm(jmeno(DB.osoby[i]))===norm(x.prijmeni+" "+x.jmeno))||"";}
function eimpInit(){
  const d=$("eimp_drop"), f=$("eimp_f");if(!d)return;
  f.addEventListener("change",()=>eimpSoubory([...f.files]));
  d.addEventListener("dragover",e=>{e.preventDefault();d.classList.add("on");});
  d.addEventListener("dragleave",()=>d.classList.remove("on"));
  d.addEventListener("drop",e=>{e.preventDefault();d.classList.remove("on");eimpSoubory([...e.dataTransfer.files].filter(x=>/\.(pdf|docx?)$/i.test(x.name)));});
  if(EIMP.length)eimpNahled();else if(EIMP_MSG)$("eimp_out").innerHTML=EIMP_MSG;   // hláška přežije překreslení po uložení
}
function eimpSoubory(files){
  if(!files.length)return;EIMP_MSG="";const out=$("eimp_out");out.innerHTML=`<p class="muted">Čtu ${files.length} PDF…</p>`;
  Promise.all(files.map(fl=>prectiSoubor(fl).then(r=>Object.assign(r,{soubor:fl.name})).catch(e=>({soubor:fl.name,chyba:errMsg(e),osoby:[]}))))
    .then(l=>{EIMP=l;eimpNahled();});
}

function eimpZaloz(){

  for(const [ri,oi] of vyb){
    const r=EIMP[ri], x=r.osoby[oi], klic=norm(x.email)||norm(x.prijmeni+" "+x.jmeno);
    if(osobaPodle(x)||uz.has(klic))continue;uz.add(klic);   // stejný člověk dvakrát v dávce (Word i PDF) → jednou
    let fid=firmaPodle(r)||novaF[r.ico||r.firma];
    if(!fid&&r.firma){fid=FDB.ref(ROOT+"/firmy").push().key;novaF[r.ico||r.firma]=fid;nF++;
      upd["firmy/"+fid]=clean({nazev:r.firma,kat:"ostatni",ico:r.ico,dic:r.dic,sidlo:r.sidlo,fakt_adresa:r.fakt_adresa,fakt_email:r.fakt_email,kontakt:clean({jmeno:r.kontakt.jmeno,email:r.kontakt.email,tel:r.kontakt.tel})});}
    const bez=/bez\s+ubytov/i.test(r.poznamka||"");
    const id=FDB.ref(ROOT+"/osoby").push().key;nO++;
    const web=r.druh==="web", kat={};kat[web?"verejnost":(r.typ||"ostatni")]=true;
    // noci a pondělní večeře z formuláře 2027 (1. noc = 26./27. 4., 2. noc = 27./28. 4. podle pořadí v Nastavení)
    const nk=noci().map(([k])=>k), nociO={}, a1=anoNe(x.noc1), a2=anoNe(x.noc2), av=anoNe(x.vec);
    if(a1&&nk[0])nociO[nk[0]]=true;if(a2&&nk[1])nociO[nk[1]]=true;
    const pozn=[r.poznamka||"",x.strava?"Strava: "+x.strava:"",x.spolu?"Chce bydlet s: "+x.spolu:"",av===true?"Chce večeři 26. 4. – vybrat menu":""].filter(Boolean).join(" · ");
    upd["osoby/"+id]=clean(stamp({prijmeni:x.prijmeni,jmeno:x.jmeno,titul_pred:x.titul_pred,titul_za:x.titul_za,email:x.email,tel:x.tel,firma:fid||"",
      kat,stav:"ano",zdroj:web?"web":"formular",ubyt:web?"":"ja",objednavka:web?r.objednavka:"",clen:web&&!!x.clen,
      noci:nociO,nespi:bez||(a1===false&&a2===false),vecere:av===false?"ne":"",pozn_partner:pozn}));
  }
  if(!nO)return;
  EIMP_MSG=`<p style="color:var(--zelena)">✔ Založeno ${pl(nO,"člověk","lidé","lidí")}${nF?" a "+pl(nF,"firma","firmy","firem"):""}. Najdeš je v Lidech. Veřejnost z webu má „hotel sám“ (kdo psal „bez ubytování“, má „nespí“); hostům, přednášejícím, vystavovatelům a YWP se noci a večeře převzaly z přihlášky (šablony 2027) – doplň jim pokoj a menu.</p>`;
  FDB.ref(ROOT).update(upd).then(()=>{EIMP=[];const o=$("eimp_out");if(o)o.innerHTML=EIMP_MSG;})
    .catch(e=>{$("eimp_msg").textContent="⚠️ "+errMsg(e);});
}

function dopravaSeznam(){   // záznam, který někdo později změnil (zmena = jeho klíč), se nezobrazuje
  const nahr=new Set(Object.values(DOPRAVA).map(x=>x.zmena).filter(Boolean));
  return Object.entries(DOPRAVA).filter(([k])=>!nahr.has(k)).map(([k,x])=>Object.assign({k},x)).sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function htmlDoprava(){
  if(DOPR_ERR)return `<div class="probbox"><div>⛔ Zájem o dopravu nejde načíst: <b>${esc(DOPR_ERR)}</b>. Chybí pravidlo pro <b>${DOPR}</b> ve Firebase.</div></div>`;
  const l=dopravaSeznam(), sum=(nast,smer)=>l.filter(x=>x.nast===nast&&(x.smer==="oba"||x.smer===smer)).reduce((a,x)=>a+(+x.n||1),0);
  if(!l.length)return `<p class="muted" style="font-size:.9rem">Zatím se nikdo nepřihlásil.</p>`;
  return `<table class="t" style="margin-bottom:8px"><tr><th></th><th>Tam (na večer)</th><th>Zpět</th></tr>
    ${Object.keys(DNAST).map(n=>`<tr><td><b>${DNAST[n]}</b></td><td>${sum(n,"tam")} os.</td><td>${sum(n,"zpet")} os.</td></tr>`).join("")}
    <tr><td><b>Celkem</b></td><td><b>${sum("kraskov","tam")+sum("sec","tam")} os.</b></td><td><b>${sum("kraskov","zpet")+sum("sec","zpet")} os.</b></td></tr></table>
    <table class="t">${l.map(x=>`<tr><td class="sub" style="white-space:nowrap">${new Date(x.ts).toLocaleString("cs",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td><b>${esc(x.jm)}</b>${x.firma?`<div class="sub">${esc(x.firma)}</div>`:""}${x.pozn?`<div class="sub">💬 ${esc(x.pozn)}</div>`:""}</td><td>${esc(DNAST[x.nast]||x.nast)} · ${esc(DSMER[x.smer]||x.smer)} · <b>${+x.n||1}</b> os.${x.zmena?' <span class="sub">(změna)</span>':""}</td><td><button class="btn red small" data-dopdel="${esc(x.k)}">Smazat</button></td></tr>`).join("")}</table>`;
}

function dotazyBox(){const b=$("s_dotazy");if(!b)return;b.innerHTML=htmlDotazy();const v=$("s_dot_vse");if(v)v.addEventListener("click",smazVse);}   // jen tahle sekce – rozepsané Nastavení zůstane
function smazVse(){if(prompt("Smazat VŠECHNY dotazy, nahrávky a hlasy? Napiš SMAZAT")==="SMAZAT")FDB.ref(DOT).remove().catch(er=>alert("⚠️ "+errMsg(er)));}
function dotazySeznam(){const r=[];for(const t in DOTAZY)for(const k in DOTAZY[t]||{})r.push(Object.assign({talk:t,k},DOTAZY[t][k]));return r.sort((a,b)=>(b.ts||0)-(a.ts||0));}
function smazDotaz(t,k){const u={};u[DOT+"/q/"+t+"/"+k]=null;u[DOT+"/au/"+k]=null;u[DOT+"/v/"+t+"/"+k]=null;return FDB.ref().update(u);}
function htmlDotazy(){

/* ---------- OSOBNÍ KARTY (průvodce: „Moje registrace“) ---------- */
// Každý člověk má v osobě klíč „karta“. Pod ním je v KAR jen to, co má vidět on sám:
// jméno, firma, kdy spí, pokoj, s kým, večeře, svoz. Žádný e-mail, telefon ani poznámka.
// Admin karty hlídá sám: po každé změně dat do 2 s přepíše jen ty, které se liší.
let KARTY={}, KARTY_OK=false, KARTY_ERR="", KARTY_T=null, KARTY_INFO="";
function loadKarty(){
  FDB.ref(KAR).on("value",s=>{KARTY=s.val()||{};KARTY_OK=true;KARTY_ERR="";kartyPlan();},
    e=>{KARTY_ERR=errMsg(e);KARTY_OK=false;if(VIEW==="nastaveni")render();});
}
function pruvodceBase(){return location.origin+location.pathname.replace(/index\.html$/,"").replace(/\/?$/,"/")+"pruvodce/";}
function kartaOdkaz(t){return pruvodceBase()+"?k="+t;}
function kartaData(id){
  const o=DB.osoby[id], n=N(), nv=nocVecere();
  const mn=nociPokoje(o);
  const spolu=o.pokoj?spolubydlici(id,o,obsazenost()).filter(i=>(DB.osoby[i].stav||"nevim")!=="ne").map(i=>{const x=DB.osoby[i], sp=nociPokoje(x).filter(n=>mn.includes(n));
    return ((x.jmeno||"")+" "+(x.prijmeni||"")).trim()+(sp.length<mn.length?" ("+sp.map(nocNazev).join(", ")+")":"");}):[];
  const p=o.pokoj?DB.pokoje[o.pokoj]:null;
  const r=clean({
    jmeno:((o.jmeno||"")+" "+(o.prijmeni||"")).trim()||jmeno(o), firma:firmaNazev(o.firma),
    kat:Object.keys(o.kat||{}).filter(k=>KAT[k]).map(k=>KAT[k][0]).join(", "),
    stav:o.stav||"nevim", konf:clean({nazev:n.nazev||"",datum:n.datum||"",misto:n.misto||""}),
    noci:spi(o).map(nocNazev), nespi:!!o.nespi&&!spi(o).length,
    pokoj:p?pokojLabel(o.pokoj):"", sekce:p?(SEKCE[p.sekce]||""):"", spolu, sam:!!o.sam,
    kraskov:!!o.kraskov, platiVHOS:!!o.platiVHOS, hotel:hotelSam(o),
    vecere:o.vecere?menuNazev(o.vecere):"", vecere_noc:nv?nocNazev(nv):""
  });
  for(const k in r)if(Array.isArray(r[k])&&!r[k].length)delete r[k];   // Firebase prázdné pole neuloží
  return r;
}
function ss(v){return v&&typeof v==="object"?(Array.isArray(v)?"["+v.map(ss).join(",")+"]":"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+ss(v[k])).join(",")+"}"):JSON.stringify(v);}
function kartyPlan(){clearTimeout(KARTY_T);KARTY_T=setTimeout(kartySync,1500);}
function kartySync(){
  if(!LOADED||!KARTY_OK||!USER)return Promise.resolve(0);
  const upd={}, platne=new Set();
  for(const id of Object.keys(DB.osoby)){
    let t=DB.osoby[id].karta;
    if(!t||KARTY[t]&&KARTY[t].osoba!==id){t=novyKlic();upd[ROOT+"/osoby/"+id+"/karta"]=t;}
    platne.add(t);
    const d=kartaData(id), stary=KARTY[t]||{};
    const {upraveno_ts:_a,osoba:_b,...bez}=stary;
    if(ss(bez)!==ss(d))upd[KAR+"/"+t]=Object.assign(d,{osoba:id,upraveno_ts:Date.now()});
  }
  for(const t of Object.keys(KARTY))if(!platne.has(t))upd[KAR+"/"+t]=null;
  const n=Object.keys(upd).length;if(!n)return Promise.resolve(0);
  return FDB.ref().update(upd).then(()=>{KARTY_INFO="Aktualizováno "+new Date().toLocaleTimeString("cs")+" ("+pl(n,"změna","změny","změn")+")";if(VIEW==="nastaveni")render();return n;})
    .catch(e=>{KARTY_ERR=errMsg(e);if(VIEW==="nastaveni")render();});
}
function kartaMail(id){
  const o=DB.osoby[id], n=N();
  const subj=(n.nazev||"Konference VHOS")+" – vaše registrace";
  const body="Dobrý den,\n\nděkujeme za přihlášku na "+(n.nazev||"konferenci VHOS")+(n.datum?" ("+n.datum+(n.misto?", "+n.misto:"")+")":"")+".\n\n"+
    "Na tomto osobním odkazu uvidíte, co máte zařízeno – kdy a kde spíte, večeři a svoz – a také program konference:\n\n"+kartaOdkaz(o.karta)+"\n\n"+
    "Odkaz je jen pro Vás, prosíme nepřeposílejte ho. V telefonu si průvodce můžete přidat na plochu.\nKdyž se něco změní, uvidíte to tam hned.\n\nDěkujeme a těšíme se na Vás\n";
  return "mailto:"+encodeURIComponent(o.email||"")+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
}
function exportKarty(){
  const rows=[["Příjmení","Jméno","Firma","Stav","E-mail","Osobní odkaz"]];
  Object.values(DB.osoby).filter(o=>o.karta).sort((a,b)=>jmeno(a).localeCompare(jmeno(b),"cs"))
    .forEach(o=>rows.push([o.prijmeni||"",o.jmeno||"",firmaNazev(o.firma),STAV[o.stav||"nevim"][0],o.email||"",kartaOdkaz(o.karta)]));
  download("konference_osobni_odkazy.csv","\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n"),"text/csv;charset=utf-8");
}
function vytvorOdkazy(fids){
  const upd={};
  for(const fid of fids){if(tokenFirmy(fid))continue;upd[novyKlic()]={firma:fid,firma_nazev:DB.firmy[fid].nazev,vytvoreno_ts:Date.now(),vytvoril:USER?USER.email:""};}
  if(!Object.keys(upd).length)return Promise.resolve(0);
  return ulozVerejne().then(()=>FDB.ref(PRI).update(upd)).then(()=>Object.keys(upd).length);
}
function emailyFirmy(fid){
  const f=DB.firmy[fid]||{}, e=new Set();
  if(f.kontakt&&f.kontakt.email)e.add(f.kontakt.email);
  Object.values(DB.osoby).forEach(o=>{if(o.firma===fid&&o.email)e.add(o.email);});
  return [...e];
}
function mailto(t){
  const p=PRIH[t], n=N();
  const subj=(n.nazev||"Konference VHOS")+" – přihláška";
  const body="Dobrý den,\n\nzveme Vás na "+(n.nazev||"konferenci VHOS")+(n.datum?" ("+n.datum+(n.misto?", "+n.misto:"")+")":"")+".\n"+
    "Prosíme o vyplnění přihlášky za firmu "+p.firma_nazev+" – kdo přijede, které noci bude spát a jakou si vybere večeři:\n\n"+odkaz(t)+"\n\n"+
    (n.uzaverka?"Přihlášku je možné upravit do "+new Date(n.uzaverka).toLocaleDateString("cs")+" stejným odkazem.\n\n":"Přihlášku je možné kdykoli upravit stejným odkazem.\n\n")+"Děkujeme\n";
  return "mailto:"+encodeURIComponent(emailyFirmy(p.firma).join(","))+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
}
function kopiruj(text,btn){
  const ok=()=>{if(btn){const t=btn.textContent;btn.textContent="✔ Zkopírováno";setTimeout(()=>btn.textContent=t,1500);}};
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok,()=>prompt("Zkopíruj odkaz:",text));else prompt("Zkopíruj odkaz:",text);
}
document.addEventListener("click",e=>{
  const kk=e.target.closest("[data-kkop]");if(kk){e.stopPropagation();kopiruj(kartaOdkaz(kk.dataset.kkop),kk);return;}
  const k=e.target.closest("[data-kopirovat]");if(k){e.stopPropagation();kopiruj(odkaz(k.dataset.kopirovat),k);return;}
  const v=e.target.closest("[data-vytvorit]");if(v){e.stopPropagation();vytvorOdkazy([v.dataset.vytvorit]).then(()=>{if(MODAL_OPEN)openFirma(v.dataset.vytvorit);}).catch(er=>alert("⚠️ "+errMsg(er)));return;}
  const pr=e.target.closest("[data-prevzit]");if(pr){e.stopPropagation();openPrevzeti(pr.dataset.prevzit);return;}
  const zo=e.target.closest("[data-zobrazit]");if(zo){e.stopPropagation();openPrihlaska(zo.dataset.zobrazit);return;}
},true);

    <label class="dropz" id="eimp_drop"><input type="file" id="eimp_f" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>⬇ Přetáhni přihlášky sem (PDF nebo Word) nebo <u>klikni a vyber</u></label>
    <div id="eimp_out"></div></div>
  <div class="stav">Každá firma má <b>vlastní tajný odkaz</b> na přihlášku. Partner vyplní své lidi, noci, spaní a večeři; tady pak přihlášku jedním klikem <b>převezmeš</b> do seznamu lidí. Pokoje přiděluješ ty.</div>
  <div class="kpis">

function popisLide(x){
  const nn=Object.keys(x.noci||{}).filter(k=>x.noci[k]).map(nocNazev);
  return [nn.length?"spí: "+nn.join(", "):(x.nespi?"nespí":"noci nevyplněny"),
    x.spani==="sam"?"chce spát sám":x.spani==="s"?"bydlet s: "+(x.s_kym||"?"):"",
    x.vecere?"večeře: "+menuNazev(x.vecere):"",x.strava?"strava: "+x.strava:"",x.poznamka||""].filter(Boolean).join(" · ");
}

/* spáruje lidi z přihlášky se seznamem a připraví změny */
function pripravPrevzeti(t){
  const p=PRIH[t], fid=p.firma, fk=(DB.firmy[fid]||{}).kat, out=[], used=new Set();
  const lide=p.lide||{};
  const jmenoX=x=>((x.prijmeni||"")+" "+(x.jmeno||"")).trim();
  for(const [pid,x] of Object.entries(lide)){
    if(!(x.prijmeni||x.jmeno))continue;
    let oid=Object.keys(DB.osoby).find(k=>DB.osoby[k].prihlaska===t&&DB.osoby[k].prihlaska_pid===pid);
    if(!oid)oid=Object.keys(DB.osoby).find(k=>{
      const o=DB.osoby[k];if(used.has(k)||(o.prihlaska&&o.prihlaska!==t))return false;
      if(norm(o.prijmeni)!==norm(x.prijmeni))return false;
      if(o.firma&&o.firma!==fid)return false;
      const a=norm(o.jmeno).slice(0,2), b=norm(x.jmeno).slice(0,2);
      return !a||!b||a===b;
    });
    if(oid)used.add(oid);
    const base=oid?JSON.parse(JSON.stringify(DB.osoby[oid])):{kat:{}};
    const r=Object.assign({},base);
    r.prijmeni=x.prijmeni||base.prijmeni||"";r.jmeno=x.jmeno||base.jmeno||"";r.firma=fid;
    if(x.email)r.email=x.email; if(x.tel)r.tel=x.tel;
    r.kat=Object.assign({},base.kat||{});if(KAT[fk])r.kat[fk]=true;
    r.stav="ano";
    r.noci={};for(const k in (x.noci||{}))if(x.noci[k]&&(N().noci||{})[k])r.noci[k]=true;
    r.nespi=!!x.nespi&&!Object.keys(r.noci).length;
    r.sam=x.spani==="sam";
    r.vecere=x.vecere||"";
    r.pozn_partner=[x.spani==="s"&&x.s_kym?"chce bydlet s: "+x.s_kym:"",x.strava?"strava: "+x.strava:"",x.poznamka||""].filter(Boolean).join(" · ");
    r.prihlaska=t;r.prihlaska_pid=pid;
    const zm=[];
    if(oid){
      const o=DB.osoby[oid];
      if((o.stav||"nevim")!=="ano")zm.push("stav → Jede");
      if(JSON.stringify(spi(o).sort())!==JSON.stringify(Object.keys(r.noci).sort()))zm.push("noci → "+(Object.keys(r.noci).map(nocNazev).join(", ")||(r.nespi?"nespí":"—")));
      if((o.vecere||"")!==r.vecere)zm.push("večeře → "+(r.vecere?menuNazev(r.vecere):"nevybráno"));
      if(!!o.sam!==r.sam)zm.push(r.sam?"chce spát sám":"nemusí spát sám");
      if((o.pozn_partner||"")!==r.pozn_partner&&r.pozn_partner)zm.push("poznámka");
      if(x.email&&o.email!==x.email)zm.push("e-mail");
      if(x.tel&&o.tel!==x.tel)zm.push("telefon");
    }
    out.push({typ:oid?(zm.length?"zmena":"stejne"):"novy",oid,r,jm:jmenoX(x),zm});
  }
  // kdo byl dřív v přihlášce a teď v ní není → nejede
  for(const [k,o] of Object.entries(DB.osoby)){
    if(o.prihlaska===t&&!lide[o.prihlaska_pid]&&!used.has(k)&&o.stav!=="ne"){
      const r=Object.assign({},o,{stav:"ne"});
      out.push({typ:"odhlasen",oid:k,r,jm:jmeno(o),zm:["stav → Nejede"+(o.pokoj?" (má pokoj "+pokojLabel(o.pokoj)+"!)":"")]});
    }
  }
  return out;
}

function pokojOptions(sel,selfId){
  const OBS=obsazenost(), bySek={};
  const mv=maVlastni(), ciz=[];
  for(const [id,p] of Object.entries(DB.pokoje)){if(mv&&!p.vlastni){ciz.push(id);continue;}(bySek[p.sekce]=bySek[p.sekce]||[]).push(id);}
  if(ciz.length)bySek["~"]=ciz;
  let h=opt("","— bez pokoje —",sel||"");
  for(const s of Object.keys(bySek).sort()){
    h+=`<optgroup label="${esc(s==="~"?"Pokoje veřejnosti (nejsou moje)":SEKCE[s]||s)}">`+bySek[s].sort((a,b)=>String(DB.pokoje[a].cislo).localeCompare(String(DB.pokoje[b].cislo),"cs",{numeric:true})).map(id=>{
      const p=DB.pokoje[id], o=OBS[id]||{};
      const nn=noci().map(([k])=>k), cn=nn.map(n=>(o[n]||[]).filter(x=>x!==selfId).length), stejne=cn.every(c=>c===cn[0]);
      const obs=stejne?`${cn[0]||0}/${p.luzka||0}${+p.pristylky?"+"+p.pristylky:""}`:nn.map((n,i)=>nocKratce(n)+" "+cn[i]+"/"+(p.luzka||0)).join(", ");
      const kdo=[...new Set([].concat(...Object.values(o)))].filter(x=>x!==selfId).map(x=>{const y=DB.osoby[x];if(!y)return "";const yn=nociPokoje(y);return jmeno(y)+(yn.length<nn.length?" ("+yn.map(nocKratce).join("+")+")":"");}).join(", ");
      return opt(id,`${s==="~"?p.sekce+"-":""}${p.cislo}${p.typ?" ("+p.typ+")":""} – ${obs}${kdo?" · "+kdo:" · volný"}`,sel||"");
    }).join("")+"</optgroup>";
  }
  return h;
}

/* ---------- POKOJ ---------- */
function openPokoj(id){
  const p=id?Object.assign({},DB.pokoje[id]):{sekce:"A",cislo:"",patro:"",typ:"",luzka:2,pristylky:0};
  const OBS=obsazenost(), o=(id&&OBS[id])||{};
  const vsichni=id?sortOsoby(Object.keys(DB.osoby).filter(k=>DB.osoby[k].pokoj===id)):[];
  const kandidati=sortOsoby(Object.keys(DB.osoby).filter(k=>!DB.osoby[k].pokoj&&DB.osoby[k].stav!=="ne"));
  kandidati.sort((a,b)=>(DB.osoby[a].stav==="ano"?0:1)-(DB.osoby[b].stav==="ano"?0:1));
  openModal(`
    <h2>${id?"Pokoj "+esc(p.sekce+"-"+p.cislo):"Nový pokoj"}</h2>
    ${id?`<div class="sub" style="font-size:.86rem;color:#666;margin:4px 0">${esc([SEKCE[p.sekce]||p.sekce,p.patro,p.typ].filter(Boolean).join(" · "))} · ${esc(p.luzka||0)} lůžka${+p.pristylky?" + "+esc(p.pristylky)+" přistýlky":""}</div>
    <table class="t"><tr><th>Noc</th><th>Obsazenost</th></tr>${noci().map(([k,n])=>{const l=o[k]||[];const max=(+p.luzka||0)+(+p.pristylky||0);return `<tr><td>${esc(n.nazev)}</td><td style="color:${l.length>max?"var(--cervena)":"inherit"}"><b>${l.length}/${esc(p.luzka||0)}</b>${l.length?" – "+l.map(i=>esc(jmeno(DB.osoby[i]))).join(", "):" – volný"}</td></tr>`;}).join("")}</table>
    <h2 class="sek">Kdo tu bydlí</h2>
    ${vsichni.length?`<table class="t">`+vsichni.map(k=>{const x=DB.osoby[k];return `<tr><td class="cl" data-osoba="${esc(k)}" style="cursor:pointer"><b>${esc(jmeno(x))}</b><div class="sub">${esc(firmaNazev(x.firma))}</div></td><td>${badgeStav(x.stav)}</td><td>${esc(spi(x).map(nocNazev).join(", ")||"⚠️ bez nocí")}</td><td>${x.sam?"👤 sám ":""}${x.platiVHOS?"platí VHOS":""}</td><td><button class="btn red small" data-odebrat="${esc(k)}">Odebrat</button></td></tr>`;}).join("")+`</table>`:'<div class="muted">Nikdo.</div>'}
    <div class="lista" style="margin-top:8px"><select id="p_kdo" style="flex:1"><option value="">— přidat osobu bez pokoje —</option>${kandidati.map(k=>{const x=DB.osoby[k];return opt(k,jmeno(x)+(x.firma?" ("+firmaNazev(x.firma)+")":"")+" – "+STAV[x.stav||"nevim"][0]+(spi(x).length?" · "+spi(x).map(nocNazev).join(", "):""),"");}).join("")}</select><button class="btn small" id="p_add">Ubytovat</button></div>`:""}
    <h2 class="sek">Údaje pokoje</h2>
    <div class="two">
      <div><label class="l">Sekce</label><select id="p_sekce">${Object.keys(SEKCE).map(k=>opt(k,SEKCE[k],p.sekce)).join("")}</select></div>
      <div><label class="l">Číslo</label><input id="p_cislo" value="${esc(p.cislo||"")}" ${id?"disabled":""}></div>
      <div><label class="l">Patro</label><input id="p_patro" value="${esc(p.patro||"")}"></div>
      <div><label class="l">Typ</label><input id="p_typ" value="${esc(p.typ||"")}"></div>
      <div><label class="l">Pevná lůžka</label><input id="p_luzka" type="number" min="0" value="${esc(p.luzka||0)}"></div>
      <div><label class="l">Přistýlky (max.)</label><input id="p_prist" type="number" min="0" value="${esc(p.pristylky||0)}"></div>
    </div>
    <div class="checks" style="margin-top:8px"><label><input type="checkbox" id="p_vlastni" ${p.vlastni?"checked":""}> <b>můj pokoj</b> – mám ho k dispozici já (v Excelu žlutý), ostatní jsou pro veřejnost</label></div>
    <label class="l">Poznámka</label><textarea id="p_poz">${esc(p.poznamka||"")}</textarea>
    <div class="mfoot"><div>${id?`<button class="btn red small" id="p_del">Smazat pokoj</button>`:""}</div><div><button class="btn ghost" id="p_cancel">Zavřít</button> <button class="btn" id="p_save">Uložit</button></div></div>
    <div class="msg" id="p_msg"></div>`);
  $("p_cancel").addEventListener("click",closeModal);
  const setPokoj=(oid,val)=>{const x=Object.assign({},DB.osoby[oid]);x.pokoj=val;return save("osoby/"+oid,stamp(x));};
  if(id){
    $("mbox").querySelectorAll("[data-odebrat]").forEach(b=>b.addEventListener("click",ev=>{ev.stopPropagation();setPokoj(b.dataset.odebrat,"").then(()=>openPokoj(id));}));
    $("p_add").addEventListener("click",()=>{const k=$("p_kdo").value;if(!k)return;setPokoj(k,id).then(()=>openPokoj(id));});
  }
  $("p_save").addEventListener("click",()=>{
    const r=Object.assign({},p,{sekce:$("p_sekce").value,cislo:$("p_cislo").value.trim(),patro:$("p_patro").value.trim(),typ:$("p_typ").value.trim(),luzka:+$("p_luzka").value||0,pristylky:+$("p_prist").value||0,poznamka:$("p_poz").value.trim(),vlastni:$("p_vlastni").checked});
    if(!r.cislo){$("p_msg").textContent="Vyplň číslo pokoje.";return;}
    const key=id||(r.sekce+"-"+r.cislo);
    if(!id&&DB.pokoje[key]){$("p_msg").textContent="Pokoj "+key+" už existuje.";return;}
    save("pokoje/"+key,r).then(closeModal).catch(e=>{$("p_msg").textContent="⚠️ "+errMsg(e);});
  });
  if(id)$("p_del").addEventListener("click",()=>{
    if(vsichni.length){alert("V pokoji někdo bydlí – nejdřív ho přesuň.");return;}
    if(confirm("Smazat pokoj "+pokojLabel(id)+"?"))save("pokoje/"+id,null).then(closeModal);
  });
}
</script>
<script src="instalace.js" data-nazev="Pořadatel" data-barva="#2f6b3c" data-qr="obrazky/qr-poradatel.png" defer></script>
</body>
</html>
