<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f4ef" />
<link rel="icon" href="../ikony/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="../ikony/favicon-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="../ikony/apple-touch-icon.png" />
<script>/* iPhone: bez manifestu – ikona na ploše si vezme aktuální adresu i s osobním klíčem */if(!(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))){var l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l)}</script>
<meta name="apple-mobile-web-app-capable" content="yes" />

<body>
<title>Seč 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: veřejný průvodce bez přihlášení – úzký sloupec (max 440px), spodní lišta pěti záložek. */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f8f6f2; --ink:#1d1b20; --muted:#68646d; --line:#e5e1d9;
  --accent:#5b2d82; --accent-ink:#ffffff; --accent-soft:#efe7f6;
  --water:#1f7a8c; --water-soft:#e2f1f3; --warn:#c8681c;
  --shadow:0 1px 2px rgba(29,27,32,.05),0 6px 20px rgba(29,27,32,.06);
  --f-display:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141316; --surface:#1d1c20; --surface-2:#242228; --ink:#f1eee9; --muted:#a7a2ac; --line:#322f36;
  --accent:#c9a6ec; --accent-ink:#1d1b20; --accent-soft:#2c2436; --water:#6cc3d2; --water-soft:#18303a; --warn:#eea05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141316; --surface:#1d1c20; --surface-2:#242228; --ink:#f1eee9; --muted:#a7a2ac; --line:#322f36;
  --accent:#c9a6ec; --accent-ink:#1d1b20; --accent-soft:#2c2436; --water:#6cc3d2; --water-soft:#18303a; --warn:#eea05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--water)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-inline:16px;padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;object-fit:contain;flex:none}
.top b{font-family:var(--f-display);font-weight:800;font-size:16px;display:block}
.top small{color:var(--muted);font-size:12px}
.chip{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--water-soft);color:var(--water);flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:color-mix(in srgb,var(--ink) 72%,transparent)}
.tabbar svg{width:22px;height:22px}.tabbar button span{line-height:1.15;text-align:center}
.tabbar button[aria-current="page"]{color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:4px 18px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;background:var(--accent-soft);color:var(--accent);font-size:14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv .hadr{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}.kv a.tel{display:inline-block;margin-top:6px;padding:5px 11px;border-radius:99px;background:var(--water-soft);color:var(--water);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}

/* pás log */
.ticker{overflow:hidden;margin-inline:-16px;padding-block:2px 10px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .track{display:flex;gap:8px;width:max-content;animation:tick 70s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:5px 9px 5px 5px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;white-space:nowrap}
@keyframes tick{to{transform:translateX(-50%)}}
.lm{border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;flex:none;width:28px;height:28px;font-size:11px;background-size:cover;background-position:center;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 8px rgba(0,0,0,.5)}

/* domů */
.hero{background:var(--surface);color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.hero .meta{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.hero .fl{display:flex;gap:4px;margin:-4px 0 6px;flex-wrap:wrap}
.hero .fl img{width:42px;height:42px;object-fit:contain}
.hero .lab{font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.stats{display:flex;gap:16px;margin-top:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.quick b{font-size:15px} .quick span{font-size:12px;color:var(--muted)}
.gen{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.news article{padding:10px 0;border-top:1px solid var(--line)}
.news article:first-child{border-top:0;padding-top:0}
.news time{font-size:12px;color:var(--muted)} .news h3{font-size:15px;font-family:var(--f-body);font-weight:700} .news p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* program */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.days button{border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.days small{display:block;font-weight:500;font-size:11px}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days .dnow{color:#d32f2f;background:color-mix(in srgb,#d32f2f 10%,transparent);display:flex;flex-direction:column;align-items:center}.days .dnow .dot{position:absolute;top:9px;left:9px}
.slot.flash .talk{animation:flashT 1.6s ease-out}@keyframes flashT{0%,40%{box-shadow:0 0 0 4px #d32f2f}}
.tools{display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bgrp{border:2px solid var(--water);border-radius:18px;padding:0 8px 10px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--water-soft) 35%,transparent);box-shadow:0 2px 0 color-mix(in srgb,var(--water) 25%,transparent)}
.block{background:var(--water);color:var(--surface);border-radius:15px 15px 10px 10px;padding:11px 12px;margin:0 -8px}
.block .chairbtn{background:color-mix(in srgb,var(--surface) 20%,transparent);color:inherit;border:1px solid color-mix(in srgb,var(--surface) 55%,transparent)}
.block h2{font-size:16px} .block p{margin:2px 0 0;font-size:13px}
.slot{display:grid;grid-template-columns:60px 1fr;gap:10px}
.slot .t{font-family:var(--f-display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;padding-top:11px;line-height:1.1}
.slot .t small{display:block;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);margin-top:2px}
.slot .t{justify-self:start;width:max-content}
.slot .t i{display:block;text-align:center;font-style:normal;font-weight:500;color:var(--muted);line-height:.8}
.slot.live .t,.slot.live .t small,.slot.live .t i{color:var(--water)}
.talk{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start;border-left:4px solid transparent}
.talk.mine{border-left-color:var(--accent)}
.mynote{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.mynote b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.tact{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tact .nbtn,.tact .qbtn{margin:0;padding:4px 8px}@media (max-width:380px){.tact .nbtn,.tact .qbtn{font-size:11px;padding:4px 6px}.tact{gap:4px}}
.nbtn{margin-top:8px;margin-left:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--accent)}
.talk.brk{background:var(--surface-2);box-shadow:none;border:1px solid var(--line)}
.talk .body{flex:1;min-width:0}
.talk h3{font-size:15px;font-family:var(--f-body);font-weight:700;line-height:1.3}
.talk .who{font-size:13px;color:var(--muted);margin-top:3px}
.talk mark{background:#ffe27a;color:#1d1b20;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px #f3c53a}
.empty{text-align:center;padding:24px 12px}

/* partneři */
.cat h2{font-size:17px;margin-bottom:8px}
.logos{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.logo{border:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center;min-width:0;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*35ms)}
.logo .lm{width:48px;height:48px;font-size:16px}
.g2 .logo .lm{width:60px;height:60px;font-size:20px}
.logo span{font-size:12px;font-weight:700;text-align:center;overflow-wrap:anywhere;line-height:1.25}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* doprava */
.tt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tt th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px 6px 0}
.tt td{padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.tt td:first-child{font-weight:700;white-space:nowrap}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:20}
.sheet.stred{top:50%;bottom:auto;left:16px;right:16px;transform:translateY(-50%);border-radius:20px;max-width:420px;padding-bottom:20px}.sheet.stred .grab{display:none}@keyframes stredIn{from{opacity:0;transform:translateY(-46%) scale(.96)}to{opacity:1;transform:translateY(-50%)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet:not([hidden]){animation:up .28s ease-out}.sheet.stred:not([hidden]){animation:stredIn .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet .close{float:right;border:0;background:var(--surface-2);border-radius:99px;width:32px;height:32px;font-size:18px}
.sheet h2{font-size:20px;padding-right:40px}
.sheet .bd{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);text-align:left;width:100%}
.mini b{display:block;font-size:14px} .mini small{color:var(--muted);font-size:12px}
.qbtn{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--water);display:inline-flex;gap:5px;align-items:center}
.qbtn.has{background:var(--water-soft);border-color:transparent}
.bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#d6342c;color:#fff;font-size:11px;font-weight:800;line-height:1;font-family:var(--f-body);box-shadow:0 0 0 2px var(--surface);animation:bdgIn .4s ease}
@keyframes bdgIn{from{transform:scale(.3)}60%{transform:scale(1.25)}}
.qbtn .bdg{margin-left:2px}
.tabbar button,.days button{position:relative}
.tabbar .bdg,.days .bdg{position:absolute;top:2px;right:calc(50% - 22px)}
.days .bdg{top:4px;right:8px}
.chairbtn{margin-top:8px;border:0;background:var(--water);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.q{padding:10px 0;border-top:1px solid var(--line)} .q:first-child{border-top:0}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.q p{margin:0;font-size:15px} .q small{color:var(--muted);font-size:12px}
.plus{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink);min-width:64px;justify-content:center}
.plus b{font-variant-numeric:tabular-nums}.plus.mine{background:var(--surface-2);color:var(--muted)}
.plus[aria-pressed="true"]{background:var(--water);color:var(--surface);border-color:transparent}
.votes{display:inline-block;margin-left:8px;font-size:13px;font-weight:800;color:var(--water);background:var(--water-soft);border-radius:99px;padding:2px 9px;vertical-align:1px}
.qform{display:flex;flex-direction:column;gap:8px}
.qform textarea,.qform input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
.send{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.proj{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:#f6f4ef;color:#1d1b20;padding:3vh 4vw;gap:2vh;font-family:var(--f-body)}
.proj.dark{background:#141218;color:#f4f1f8}
.proj .pjh{display:flex;align-items:flex-start;gap:2vw}.proj .pjh .pjtl{flex:1;min-width:0}
.proj .pjh .pjbl{font:700 clamp(12px,1.4vw,22px) var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:#5b2d82}.proj.dark .pjh .pjbl{color:#c9a6ea}
.proj .pjh .pjtt{font-weight:700;font-size:clamp(16px,2.2vw,36px);line-height:1.2;margin-top:.4vh}
.proj .pjh .pjsp{font-size:clamp(13px,1.6vw,26px);opacity:.7;margin-top:.3vh}
.proj .pjh .pjcnt{font:700 clamp(14px,1.8vw,30px) var(--f-mono);opacity:.6;white-space:nowrap}
.proj .pjm{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.proj .pjq{font-weight:700;line-height:1.18;max-width:92vw;overflow-wrap:anywhere}
.proj .pjq.rd{opacity:.45}
.proj .pjspk{font-size:min(28vh,28vw);line-height:1}
.proj .pjplay{border:0;border-radius:999px;background:#1f7a8c;color:#fff;font:800 clamp(18px,2.6vw,44px) var(--f-body);padding:1.6vh 3.2vw;display:inline-flex;align-items:center;gap:1vw;cursor:pointer}
.proj .pjf{display:flex;align-items:center;gap:1.4vw;flex-wrap:wrap}
.proj .pjf .pjwho{flex:1;min-width:0;font-size:clamp(14px,1.9vw,32px);opacity:.75}
.proj .pjf .pjvt{font-weight:800;color:#5b2d82;margin-left:1vw}.proj.dark .pjf .pjvt{color:#c9a6ea}
.proj .pjf button{border:1.5px solid rgba(120,110,130,.35);background:transparent;color:inherit;border-radius:12px;padding:1vh 1.4vw;font:700 clamp(13px,1.5vw,24px) var(--f-body);cursor:pointer}
.proj .pjf button.on{background:#5b2d82;border-color:#5b2d82;color:#fff}
.proj.dark .pjq.rd{opacity:.55}
@media (max-width:700px){.proj{padding:2vh 4vw calc(2vh + env(safe-area-inset-bottom))}.proj .pjf .pjwho{flex-basis:100%;font-size:15px}.proj .pjf{gap:8px}.proj .pjf button{padding:10px 12px;font-size:15px}.proj .pjplay{font-size:20px;padding:14px 24px}}
.proj .pjempty{font-size:clamp(20px,3vw,48px);opacity:.6}
.chair .projall{display:block;width:100%;margin:4px 0 6px;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.chair h3{font-size:15px;font-family:var(--f-body);font-weight:700;margin:14px 0 4px;color:var(--water)}
.cq{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--surface-2);margin-top:8px}
.cq p{margin:0;font-size:19px;line-height:1.35;font-weight:600}
.cq small{color:var(--muted);font-size:12px}
.cq.read{opacity:.45}
.cq button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.cq.read button{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px}
.qpodf{display:grid;gap:6px}.qpodf[hidden]{display:none}
.signas{font-size:13px;color:var(--muted)} .signas b{color:var(--ink)}
.linkb{border:0;background:none;padding:0;color:var(--water);font-weight:700;text-decoration:underline;font-size:13px}
.now{border:0;width:100%;text-align:left;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--water)}
.now.brk{border-left-color:var(--warn)}
.now .lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--water)}
.now.brk .lbl{color:var(--warn)}

.stage{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:10px 0 8px;overflow:hidden}
.stg-pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.stg-pills button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 11px;font-family:var(--f-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);transition:all .35s ease}

<script>
/* ===== Program podle pozvánky 2026 (30. ročník) – data v program.js ===== */
const VERZE="1.03 · 22. 10. 2026";
// Ukázky (simulace času, ukázkové aktuality a dotazy, „Ukázka“ v záhlaví, ukázka profilu partnera) jen s ?ukazka=1 – platí v tomto okně (?ukazka=0 vypne)
const UKAZKA=(()=>{try{const u=new URLSearchParams(location.search).get("ukazka");if(u!=null)sessionStorage.setItem("pr_ukazka",u==="1"?"1":"");return sessionStorage.getItem("pr_ukazka")==="1"}catch(e){return false}})();
// Vyzkoušení času – kdokoli si ho zapne tlačítkem na Domů (jen simulace času, bez ukázkových dat); platí do zavření okna
let SIMZAP=UKAZKA||(()=>{try{return sessionStorage.getItem("pr_sim")==="1"}catch(e){return false}})();
function simZap(on){SIMZAP=on||UKAZKA;try{sessionStorage.setItem("pr_sim",on?"1":"")}catch(e){}}
try{localStorage.removeItem("pr_posun")}catch(e){}   // posun programu zrušen (jede se podle plánovaných časů)   // verze průvodce – při každém nasazení zvýšit
const TERMIN="27.–28. dubna 2027";
function clock(){ // skutečný čas během konference; mimo ni v ostré verzi „před“ / „po“ konferenci, v ukázce simulace
 const d=new Date(),iso=d.toISOString().slice(0,10),day=Object.keys(DATES).find(k=>DATES[k]===iso);
 if(day)return {day,m:d.getHours()*60+d.getMinutes(),real:1};
 if(!SIMZAP)return iso<DATES.ut?{day:"ut",m:-1,real:0,mimo:"pred"}:{day:"st",m:1439,real:0,mimo:"po"};
 let m=S.sim.m+Math.floor((Date.now()-(S.sim.t0||Date.now()))/60000*(S.sim.x||1)),den=S.sim.day;   // ukázka: nastavený čas dál běží
 if(m>=1440&&den==="ut"){den="st";m-=1440}if(m>1439)m=1439;
 return {day:den,m,real:0};
}
function simNastav(day,m){S.sim.day=day;S.sim.m=m;S.sim.t0=Date.now()}
const hm=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
const mss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const dur=m=>m>=60?Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":""):m+" min";
function naAktualni(){   // „Právě teď“: běží-li něco, skok na to; jinak srozumitelné okno (ráno, volno, konec dne, konec konference)
 const st=nowState(),c=st.c,D=DAYS.find(d=>d.k===c.day),di=DAYS.indexOf(D),dalsi=DAYS[di+1];
 const ukaz=(den,x)=>{closeSheet();S.day=den;S.q="";S.mine=false;if(S.tab!=="program")S.tab="program";render();if(x)setTimeout(()=>ukazBod(x.id),60)};
 if(st.cur)return ukaz(c.day,st.cur);
 const okno=(h,t,tl)=>{openSheet(`<h2>${h}</h2><div class="bd"><p style="margin:0 0 12px">${t}</p><div class="cact">${tl}</div></div>`,true)};
 const bod=x=>`<b>${esc(x.t)}</b> – ${esc(x.h)}`;
 if(st.next&&st.first&&c.m<st.first.a){okno("Zatím nic neběží",`${D.n} ${D.d} začíná program v ${bod(st.first)}.<br><span class="muted">Zbývá ${dur(st.first.a-c.m)}.</span>`,`<button class="cbtn" data-nowuk="${c.day}|${st.first.id}" style="border:0">Ukázat v programu</button>`);return}
 if(st.next){okno("Teď je volno",`Další bod programu v ${bod(st.next)}.<br><span class="muted">Za ${dur(st.next.a-c.m)}.</span>`,`<button class="cbtn" data-nowuk="${c.day}|${st.next.id}" style="border:0">Ukázat v programu</button>`);return}
 if(dalsi){const f=PROG[dalsi.k].find(x=>!x.blok&&x.a!=null);okno("Dnešní program skončil",`Děkujeme za dnešek! Zítra (${dalsi.n.toLowerCase()} ${dalsi.d}) začínáme v ${bod(f)}.`,`<button class="cbtn" data-nowuk="${dalsi.k}|${f.id}" style="border:0">Ukázat zítřejší program</button>`);return}
 okno("Konference skončila",`Děkujeme za účast na 31. ročníku a těšíme se na shledanou <b>4.–5. dubna 2028</b> v Seči.<br><span class="muted">Nezapomeňte si uložit poznámky – a budeme rádi za váš ohlas.</span>`,
  `<button class="cbtn" data-ohl="0" style="border:0">💬 Napsat ohlas</button><button class="cbtn" data-go="poznamky" style="border:0">📝 Poznámky</button><button class="cbtn" data-kal="2028" style="border:0">📅 Termín 2028</button>`)}
function ukazBod(id){const el=$("t-"+id);if(!el)return;el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1700)}
function naPrednasku(id,dotazy){   // přepne den, zruší filtry a posune na přednášku (a případně otevře její dotazy)
 const d=Object.keys(PROG).find(k=>PROG[k].some(y=>y.id===id));if(!d)return;closeSheet();S.day=d;S.q="";S.mine=false;if(S.tab!=="program")S.tab="program";render();setTimeout(()=>{ukazBod(id);if(dotazy)setTimeout(()=>sheetQ(id),450)},60)}
function noveSeznam(den){   // přednášky s nepřečtenými dotazy (volitelně jen jeden den)
 return (den?PROG[den]:ALLT).filter(x=>x.id&&novych(x.id)).map(x=>({x,n:novych(x.id),d:DAYS.find(z=>PROG[z.k].includes(x))}))}
function noveRadky(den){return noveSeznam(den).map(({x,n,d})=>`<button class="nvr" data-naq="${x.id}"><span class="nvt">${esc(d?d.n.slice(0,2):"")} ${esc(x.t)}</span><span class="nvh">${esc(x.h)}</span><span class="nvn">${n} ${n===1?"nový":n<5?"nové":"nových"}</span></button>`).join("")}
function vNove(){const n=novychVse();if(!n)return "";
 return `<div class="card nvbox"><div class="label" style="margin-bottom:6px">💬 Nové dotazy · ${n}</div>${noveRadky()}<button class="linkb" data-navse style="margin-top:8px">Označit vše jako přečtené</button></div>`}
function sheetNove(den){
 if(den?!novychDen(den):!novychVse())return toast("Žádné nové dotazy");const dn=den&&DAYS.find(z=>z.k===den);
 openSheet(`<h2>Nové dotazy${dn?" · "+dn.n:""}</h2><div class="muted" style="font-size:13px;margin-top:2px">Ťukněte na přednášku – program se na ni posune</div><div class="bd">${noveRadky(den)}</div>`)}
function probehlo(x,c){   // přednáška už skončila (dřívější den, nebo dnes po konci) – upozornění nemá smysl
 const di=DAYS.findIndex(z=>PROG[z.k].includes(x)),ci=DAYS.findIndex(z=>z.k===c.day);if(di<0||ci<0||x.a==null)return false;
 return di<ci||(di===ci&&c.m>=(x.b??x.a+1))}
function nowState(){
 const c=clock(),l=PROG[c.day].filter(x=>!x.blok&&x.a!=null);
 const cur=l.find(x=>x.a<=c.m&&c.m<(x.b??x.a+1)), next=l.find(x=>x.a>c.m);
 const bk=cur&&ALLT.find(y=>y.blok&&y.bid===cur.bid);
 return {c,cur,next,bk,first:l[0],last:l[l.length-1]};
}

 // Na pozadí (jiná záložka / aplikace) se spojení zavře a po návratu otevře znovu – viz ZDROJE níže.
 const h={},z={zavreno:false,poll:false,addEventListener(t,f){(h[t]=h[t]||[]).push(f)},close(){z.zavreno=true;zastav();ZDROJE.delete(z)}};
 const emit=(t,data)=>(h[t]||[]).forEach(f=>{try{f({type:t,data})}catch(e){}});
 let es=null,posl=null,tm=null,iv=null;

 const stahni=()=>{if(z.zavreno||navigator.onLine===false)return;fetchT(url).then(r=>{if(r.status===401&&/auth=/.test(url))return emit("auth_revoked","null");if(!r.ok)return r.status===401||r.status===403?emit("cancel","null"):0;
  return r.text().then(t=>{if(t===posl)return;posl=t;emit("put",JSON.stringify({path:"/",data:JSON.parse(t)}))})}).catch(()=>{})};
 const anket=()=>{stahni();iv=setInterval(stahni,sek*1000)};
 const spust=()=>{if(z.zavreno||es||iv)return;posl=null;if(z.poll)return anket();
  let prislo=false;try{const e=es=new EventSource(url);["put","patch","cancel","auth_revoked"].forEach(t=>e.addEventListener(t,ev=>{if(e!==es)return;prislo=true;emit(t,ev.data)}))}catch(e){es=null}
  tm=setTimeout(()=>{if(prislo||z.zavreno||!es)return;es.close();es=null;z.poll=true;anket()},8000)};
 z._pauza=zastav;z._spust=spust;ZDROJE.add(z);if(!document.hidden&&!ZDROJE.pauza)spust();

function treeSet(root,path,data,patch){
 const ks=path.split("/").filter(Boolean);if(!ks.length){if(patch){for(const k in data)root[k]=data[k];return root}return data||{}}
 let o=root;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||!o[k])o[k]={};o=o[k]});const last=ks[ks.length-1];
 if(patch){o[last]=o[last]||{};for(const k in data){if(data[k]==null)delete o[last][k];else o[last][k]=data[k]}}else if(data==null)delete o[last];else o[last]=data;
 return root;
}

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/",SBCACHE="sbornik-v1";

function sbStavUloz(){const b=$("sbuloz");if(!b||!("caches" in window))return;caches.open(SBCACHE).then(c=>c.match(sbUrl())).then(m=>{if(m&&b.isConnected&&!b.dataset.bezi){b.textContent="✓ Uloženo v telefonu · smazat";b.dataset.sbuloz="smaz"}}).catch(()=>{})}
async function sbUloz(b){
 if(b.dataset.sbuloz==="smaz"){if(!confirm("Smazat sborník z telefonu? Dál ho půjde listovat se signálem."))return;await caches.delete(SBCACHE);b.textContent=`⬇ Uložit do telefonu (${SBORNIK.mb} MB)`;b.dataset.sbuloz="1";return toast("Sborník smazán z telefonu")}
 if(b.dataset.bezi)return;b.dataset.bezi="1";
 try{const r=await fetch(sbUrl(),{cache:"no-store"});if(!r.ok)throw 0;const cel=+r.headers.get("content-length")||SBORNIK.mb*1048576,rd=r.body.getReader(),kus=[];let n=0;
  for(;;){const {done,value}=await rd.read();if(done)break;kus.push(value);n+=value.length;b.textContent=`Ukládám… ${Math.min(99,Math.round(n/cel*100))} %`}
  const c=await caches.open(SBCACHE);
  await c.put(sbUrl(),new Response(new Blob(kus,{type:"application/pdf"}),{headers:{"Content-Type":"application/pdf","Content-Length":String(n),"Accept-Ranges":"bytes"}}));
  await Promise.all(["pdf.min.js","pdf.worker.min.js"].map(f=>c.add(PDFJS+f).catch(()=>{})));
  delete b.dataset.bezi;b.textContent="✓ Uloženo v telefonu · smazat";b.dataset.sbuloz="smaz";toast("Sborník je uložený – půjde listovat i bez signálu");
 }catch(e){delete b.dataset.bezi;b.textContent=`⬇ Uložit do telefonu (${SBORNIK.mb} MB)`;toast("Uložení se nepovedlo – zkuste to na Wi-Fi")}

function sbPdfjs(){return SB.nac||(SB.nac=new Promise((ok,ko)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";

async function sbStavba(str){

let LB=null;

function drawLb(){
 let el=document.getElementById("lb");if(!el){el=document.createElement("div");el.id="lb";el.className="lb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);
  el.addEventListener("click",e=>{if(e.target.closest("[data-lbx]"))closeLb();else if(e.target.closest("[data-lbp]"))stepLb(-1);else if(e.target.closest("[data-lbn]"))stepLb(1)});
  let x0=null;el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)stepLb(dx<0?1:-1);x0=null})}
 const {a,i}=LB;
 el.innerHTML=`<div class="bar"><b>${esc(a.h)} · ${i+1} / ${a.n}</b><button data-lbx aria-label="Zavřít">×</button></div>
  <div class="stage"><div class="img" style="${phStyle(a,i)}">Zde bude fotografie<br>„${esc(a.cap[i])}“</div>
  <button class="nav prev" data-lbp aria-label="Předchozí">‹</button><button class="nav next" data-lbn aria-label="Další">›</button></div>
  <div class="cap">${esc(a.cap[i])}</div>`;
 el.querySelector("[data-lbx]").focus();
}
function stepLb(d){if(!LB)return;LB.i=(LB.i+d+LB.a.n)%LB.a.n;drawLb()}
function closeLb(){const el=document.getElementById("lb");if(el)el.remove();LB=null}
document.addEventListener("keydown",e=>{if(!LB)return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")stepLb(-1);if(e.key==="ArrowRight")stepLb(1)});

function prepis(taId){

 const r=new SR();r.lang="cs-CZ";r.continuous=true;r.interimResults=true;
 const zaklad=ta.value.trim()?ta.value.trim()+" ":"";let fin="";
 r.onresult=e=>{let mez="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+" ";else mez+=t}
  ta.value=(zaklad+fin+mez).replace(/\s+/g," ").replace(/^./,c=>c.toUpperCase());};
 r.onerror=e=>{if(REC.dikt&&e&&/not-allowed|service-not-allowed/.test(e.error)){diktujStop();toast("Bez povolení mikrofonu to nejde – povolte ho v prohlížeči")}};r.onend=()=>{if((REC.mr||REC.dikt)&&REC.sr===r){try{r.start()}catch(e){}}};   // Android po pauze končí – pokračovat
 try{r.start()}catch(e){return null}return r;
}
function nahravej(hotovo,o){   // o: tlačítko, info, pole přepisu, max. délka (s)

 const b=$(o.b), info=$(o.info);
 if(REC.mr){REC.mr.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Tento prohlížeč neumí nahrávat – napište dotaz textem");
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{
  const typ=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(st,Object.assign({audioBitsPerSecond:24000},typ?{mimeType:typ}:{})), ch=[];REC.mr=mr;REC.start=Date.now();
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(REC.t);REC.mr=null;const sr=REC.sr;REC.sr=null;if(sr)try{sr.stop()}catch(e){}b.textContent=o.znovu;b.classList.remove("on");info.textContent="";
   const sek=Math.round((Date.now()-REC.start)/1000);
   const bl=new Blob(ch,{type:mr.mimeType||typ||"audio/webm"});const fr=new FileReader();fr.onload=()=>hotovo(fr.result,bl,sek);fr.readAsDataURL(bl)};
  mr.start();REC.sr=prepis(o.ta);b.textContent="⏹ Hotovo – ukončit";b.classList.add("on");
  REC.t=setInterval(()=>{const sec=Math.floor((Date.now()-REC.start)/1000);info.textContent=(REC.sr?"● nahrávám a přepisuji ":"● nahrávám ")+mss(sec)+" / "+mss(o.max);if(sec>=o.max)mr.stop()},250);
 }).catch(()=>toast("Bez povolení mikrofonu to nejde – povolte ho v prohlížeči"));

 $(ta).focus()}

function tymToken(){const s=TYM.s;if(!s||!s.rt)return Promise.reject(new Error("odhlášen"));if(Date.now()<s.exp)return Promise.resolve(s.it);
 return fbPost("https://securetoken.googleapis.com/v1/token?key="+FBKEY,"grant_type=refresh_token&refresh_token="+encodeURIComponent(s.rt),true)
  .then(d=>{tymUloz(d);return TYM.s.it}).catch(e=>{if(e.st===400&&/INVALID_REFRESH_TOKEN|TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND/.test(e.message))tymOdhlas("Přihlášení vypršelo, přihlaste se znovu.","Google: "+e.message);throw e})}
function tymOdkaz(em){store.set("tymEm",em);
 return fbPost("https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key="+FBKEY,{requestType:"EMAIL_SIGNIN",email:em,continueUrl:location.origin+location.pathname+"?tym=1"})}
function tymZOdkazu(url){   // odkaz z e-mailu (otevřený, nebo vložený ručně) → přihlásit
 let u;try{u=new URL(String(url).trim())}catch(e){return false}const oob=u.searchParams.get("oobCode");if(!oob||u.searchParams.get("mode")!=="signIn")return false;
 let em=store.get("tymEm","");if(!em)em=(prompt("Potvrďte e-mail, na který přišel přihlašovací odkaz:")||"").trim();if(!em)return true;
 toast("Přihlašuji…");
 const zkus=(em,znovu)=>fbPost("https://identitytoolkit.googleapis.com/v1/accounts:signInWithEmailLink?key="+FBKEY,{email:em,oobCode:oob}).then(d=>{store.set("tymEm",em);return d})
  .catch(e=>{if(znovu||!/^INVALID_EMAIL/.test(String(e.message)))throw e;   // uložený e-mail nesedí (odkaz si poslal z jiného zařízení) → zeptat se
   const em2=(prompt("Odkaz přišel na jiný e-mail než "+em+".\nNa jaký e-mail přišel?",em)||"").trim();if(!em2||em2===em)throw e;return zkus(em2,true)});
 zdrojePauza(true);   // uvolnit spojení na Firebase pro přihlašovací dotazy (viz ZDROJE)
 zkus(em,false).then(d=>{TYM.s=null;tymUloz(d);return tymOver(true)}).catch(e=>tymVysledek("⚠️ Přihlášení se nepovedlo",esc(tymChyba(e))+". Zkuste to znovu: Info → dole „🔑 Pro pořadatele“.")).finally(()=>zdrojePauza(false));return true}
function tymVysledek(h,t){go("info");setTimeout(()=>openSheet(`<h2>${h}</h2><div class="bd"><p style="margin:0">${t}</p><button class="send" id="tvok" style="margin-top:14px">Rozumím</button></div>`,true),50);
 setTimeout(()=>{const b=$("tvok");if(b)b.addEventListener("click",closeSheet)},120)}
function tymOver(poOdkazu){   // je e-mail v seznamu týmu, nebo pořadatel (stejný seznam jako aplikace pořadatele)?
 const cti=(t,u)=>fetchT(FBDB+u+"/"+tymKlic(TYM.s.em)+".json?auth="+t).then(r=>{if(r.ok)return r.json();if(u==="florian_login_email"&&r.status===401)return null;throw new Error("SPOJENI")});   // výpadek ≠ „není v týmu“ – neodhlašovat
 return tymToken().then(t=>Promise.all([cti(t,"konference2027_tym"),cti(t,"florian_login_email")])).then(([v,o])=>{
  if(v!==true&&o==null){const em=TYM.s.em;tymOdhlas(null,"e-mail "+em+" není v týmu ani mezi pořadateli");if(poOdkazu)tymVysledek("Tento e-mail nemá přístup",`Odkaz byl v pořádku, ale e-mail <b>${esc(em)}</b> není mezi pořadateli ani v týmu.<br><br>Pořadatel: přihlaste se stejným e-mailem jako do aplikace pořadatele. Člen týmu: požádejte pořadatele, ať vás přidá (aplikace pořadatele → Průvodce → Tým).`);return}
  TYM.s.ok=true;TYM.s.org=o!=null;store.set("tym",TYM.s);if(poOdkazu)tymVysledek("🔑 Přihlášeno","Jste přihlášen jako <b>"+esc(tymJmeno())+"</b> ("+(o!=null?"pořadatel":"tým pořadatele")+"). Karta s ohlasy a zprávou všem je nahoře v Info.");else toast("🔑 Přihlášeno: "+tymJmeno());tymStart();if(S.tab==="info")render();else go("info")})}
function tymOdhlas(proc,duvod){if(duvod||proc!=="Odhlášeno")store.set("tymOdhl",{t:Date.now(),d:duvod||proc||"bez důvodu",v:VERZE});   // důvod automatického odhlášení – ukáže se v okně přihlášení
 if(TYM.es)TYM.es.close();TYM.es=null;TYM.s=null;TYM.ohl={};TYM.nac=false;store.set("tym",null);if(proc)toast(proc);render()}
// Klíč ohlasu je `id` – pole `k` v datech je hodnocení konference (dřív klíč přepsalo → průměr NaN a Smazat/Zveřejnit mířilo vedle)
function tymOhlasy(){return Object.keys(TYM.ohl).map(id=>Object.assign({},TYM.ohl[id],{id})).filter(x=>x&&x.ts).sort((a,b)=>b.ts-a.ts)}
function tymNovy(x){return x.ts>TYM.seen&&!TYM.seenK[x.id]}
function tymNove(){return tymJe()?tymOhlasy().filter(tymNovy).length:0}
function tymPrecteno(ids){ids.forEach(id=>TYM.seenK[id]=1);store.set("tymSeenK",TYM.seenK)}
function tymStart(){   // živý seznam ohlasů; token platí hodinu → Firebase pošle auth_revoked a připojíme se s novým
 if(!tymJe()||!window.EventSource)return;if(TYM.es)TYM.es.close();
 tymToken().then(t=>{const es=TYM.es=zivyZdroj(FBDB+"konference2027_ohlasy/o.json?auth="+t,30);
  const on=ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(!d)return;const stare=new Set(Object.keys(TYM.ohl)),prvni=!TYM.nac;
   TYM.ohl=treeSet(TYM.ohl,d.path,d.data,ev.type==="patch")||{};TYM.nac=true;
   if(!prvni){const n=tymOhlasy().filter(x=>!stare.has(x.id));if(n.length)tymUpoz(n[0])}render()};
  es.addEventListener("put",on);es.addEventListener("patch",on);
  es.addEventListener("auth_revoked",()=>{es.close();setTimeout(tymStart,500)});
  es.addEventListener("cancel",()=>{es.close();tymOver().catch(()=>{})});   // pravidlo nepustí → ověřit, zda je ještě v týmu
 }).catch(()=>setTimeout(tymStart,60000))}

 const l=tymOhlasy(),nov=l.filter(tymNovy).length;   // přečtené se značí ✓ u každého ohlasu (dřív otevření označilo vše)

 openSheet(`<h2>💬 Ohlasy</h2><div class="muted" style="font-size:13px;margin-top:2px">${l.length} ${l.length===1?"ohlas":l.length>1&&l.length<5?"ohlasy":"ohlasů"} · vidí jen tým pořadatele</div><div class="bd">

 tymToken().then(t=>akce==="zverejnit"?req(t,"zv/"+k,"PUT",{t:x.lib,a:x.a||"",ts:x.ts}):req(t,"zv/"+k,"DELETE").then(()=>akce==="smazat"?req(t,"o/"+k,"DELETE"):0))

/* ===== Kolik lidí má teď průvodce otevřený (konference2027_online) ===== */
// Otevřený průvodce (obrazovka zapnutá) každou minutu zapíše d/{DEV} = čas serveru – anonymně, jen kód zařízení.
// Serverová funkce konferenceOnline (mojebudky) jednou za minutu spočítá aktivní za 2,5 min a zapíše
// n = {n, ts, max, maxTs, den}. Průvodce čte jen n, takže 400 telefonů nestahuje seznam všech.
const ONDB=FBDB+"konference2027_online/";
const ONL={n:null};
function onlTep(){if(document.visibilityState!=="visible"||navigator.onLine===false)return;fetch(ONDB+"d/"+DEV+".json",{method:"PUT",body:'{".sv":"timestamp"}'}).catch(()=>{})}
function onlLidi(n){return n===1?"člověk":n>=2&&n<=4?"lidé":"lidí"}
function onlCerstve(){return !!(ONL.n&&ONL.n.ts&&Date.now()-ONL.n.ts<5*60000&&ONL.n.n>0)}
function onlTxt(){return onlCerstve()?`<i></i><span>Teď s námi v průvodci <b>${ONL.n.n}</b> ${onlLidi(ONL.n.n)}</span>`:""}
function vOnline(){return `<div class="onl" ${onlCerstve()?"":"hidden"}>${onlTxt()}</div>`}
function tymOnlTxt(){const o=ONL.n;if(!onlCerstve())return "📶 Počet lidí online se zobrazí, jakmile bude někdo připojený.";
 return `📶 Online teď <b>${o.n}</b> · dnes nejvíc <b>${o.max||o.n}</b>${o.maxTs?" (v "+new Date(o.maxTs).toLocaleTimeString("cs",{hour:"2-digit",minute:"2-digit"})+")":""}`}
function onlUkaz(){document.querySelectorAll(".onl").forEach(e=>{e.hidden=!onlCerstve();e.innerHTML=onlTxt()});const t=$("tymonl");if(t)t.innerHTML=tymOnlTxt()}
function onlStart(){onlTep();setInterval(onlTep,60000);document.addEventListener("visibilitychange",onlTep);setInterval(onlUkaz,60000);
 const es=zivyZdroj(ONDB+"n.json",60);
 const on=ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(!d)return;ONL.n=treeSet(ONL.n||{},d.path,d.data,ev.type==="patch");onlUkaz()};
 es.addEventListener("put",on);es.addEventListener("patch",on);es.addEventListener("cancel",()=>es.close())}
