<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f4ef" />
<link rel="icon" href="../ikony/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="../ikony/favicon-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="../ikony/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Seč 27" />
<meta name="application-name" content="Seč 27" />
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.IMGBASE="../obrazky/";</script>
</head>
<body>
<title>Seč 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: veřejný průvodce bez přihlášení – úzký sloupec (max 440px), spodní lišta pěti záložek. */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f8f6f2; --ink:#1d1b20; --muted:#68646d; --line:#e5e1d9;
  --accent:#5b2d82; --accent-ink:#ffffff; --accent-soft:#efe7f6;
  --water:#1f7a8c; --water-soft:#e2f1f3; --warn:#c8681c;
  --shadow:0 1px 2px rgba(29,27,32,.05),0 6px 20px rgba(29,27,32,.06);
  --f-display:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141316; --surface:#1d1c20; --surface-2:#242228; --ink:#f1eee9; --muted:#a7a2ac; --line:#322f36;
  --accent:#c9a6ec; --accent-ink:#1d1b20; --accent-soft:#2c2436; --water:#6cc3d2; --water-soft:#18303a; --warn:#eea05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141316; --surface:#1d1c20; --surface-2:#242228; --ink:#f1eee9; --muted:#a7a2ac; --line:#322f36;
  --accent:#c9a6ec; --accent-ink:#1d1b20; --accent-soft:#2c2436; --water:#6cc3d2; --water-soft:#18303a; --warn:#eea05a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--water)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-inline:16px;padding-block:0 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;object-fit:contain;flex:none}
.top b{font-family:var(--f-display);font-weight:800;font-size:16px;display:block}
.top small{color:var(--muted);font-size:12px}
.chip{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--water-soft);color:var(--water);flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabbar button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:4px 18px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;background:var(--accent-soft);color:var(--accent);font-size:14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* pás log */
.ticker{overflow:hidden;margin-inline:-16px;padding-block:2px 10px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .track{display:flex;gap:8px;width:max-content;animation:tick 70s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:5px 9px 5px 5px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;white-space:nowrap}
@keyframes tick{to{transform:translateX(-50%)}}
.lm{border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;flex:none;width:28px;height:28px;font-size:11px;background-size:cover;background-position:center;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 8px rgba(0,0,0,.5)}

/* domů */
.hero{background:var(--surface);color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.hero .meta{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.hero .fl{display:flex;gap:4px;margin:-4px 0 6px;flex-wrap:wrap}
.hero .fl img{width:42px;height:42px;object-fit:contain}
.hero .lab{font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.stats{display:flex;gap:16px;margin-top:8px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.quick b{font-size:15px} .quick span{font-size:12px;color:var(--muted)}
.gen{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.news article{padding:10px 0;border-top:1px solid var(--line)}
.news article:first-child{border-top:0;padding-top:0}
.news time{font-size:12px;color:var(--muted)} .news h3{font-size:15px;font-family:var(--f-body);font-weight:700} .news p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* program */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.days button{border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.days small{display:block;font-weight:500;font-size:11px}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bgrp{border:2px solid var(--water);border-radius:18px;padding:0 8px 10px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--water-soft) 35%,transparent);box-shadow:0 2px 0 color-mix(in srgb,var(--water) 25%,transparent)}
.block{background:var(--water);color:var(--surface);border-radius:15px 15px 10px 10px;padding:11px 12px;margin:0 -8px}
.block .chairbtn{background:color-mix(in srgb,var(--surface) 20%,transparent);color:inherit;border:1px solid color-mix(in srgb,var(--surface) 55%,transparent)}
.block h2{font-size:16px} .block p{margin:2px 0 0;font-size:13px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px}
.slot .t{font-family:var(--f-display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;padding-top:11px;line-height:1.1}
.slot .t small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted)}
.talk{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;min-width:0;display:flex;gap:8px;align-items:flex-start;border-left:4px solid transparent}
.talk.mine{border-left-color:var(--accent)}
.mynote{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.mynote b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.nbtn{margin-top:8px;margin-left:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--accent)}
.talk.brk{background:var(--surface-2);box-shadow:none;border:1px solid var(--line)}
.talk .body{flex:1;min-width:0}
.talk h3{font-size:15px;font-family:var(--f-body);font-weight:700;line-height:1.3}
.talk .who{font-size:13px;color:var(--muted);margin-top:3px}
.empty{text-align:center;padding:24px 12px}

/* partneři */
.cat h2{font-size:17px;margin-bottom:8px}
.logos{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.logo{border:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*35ms)}
.logo .lm{width:48px;height:48px;font-size:16px}
.g2 .logo .lm{width:60px;height:60px;font-size:20px}
.logo span{font-size:12px;font-weight:700;text-align:center;overflow-wrap:anywhere;line-height:1.25}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* doprava */
.tt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tt th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px 6px 0}
.tt td{padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.tt td:first-child{font-weight:700;white-space:nowrap}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet:not([hidden]){animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet .close{float:right;border:0;background:var(--surface-2);border-radius:99px;width:32px;height:32px;font-size:18px}
.sheet h2{font-size:20px;padding-right:40px}
.sheet .bd{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);text-align:left;width:100%}
.mini b{display:block;font-size:14px} .mini small{color:var(--muted);font-size:12px}
.qbtn{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--water);display:inline-flex;gap:5px;align-items:center}
.qbtn.has{background:var(--water-soft);border-color:transparent}
.bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#d6342c;color:#fff;font-size:11px;font-weight:800;line-height:1;font-family:var(--f-body);box-shadow:0 0 0 2px var(--surface);animation:bdgIn .4s ease}
@keyframes bdgIn{from{transform:scale(.3)}60%{transform:scale(1.25)}}
.qbtn .bdg{margin-left:2px}
.tabbar button,.days button{position:relative}
.tabbar .bdg,.days .bdg{position:absolute;top:2px;right:calc(50% - 22px)}
.days .bdg{top:4px;right:8px}
.chairbtn{margin-top:8px;border:0;background:var(--water);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.q{padding:10px 0;border-top:1px solid var(--line)} .q:first-child{border-top:0}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.q p{margin:0;font-size:15px} .q small{color:var(--muted);font-size:12px}
.plus{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;font-weight:700;font-size:12px;white-space:nowrap;color:var(--water)}
.plus[aria-pressed="true"]{background:var(--water);color:var(--surface);border-color:transparent}
.votes{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--water)}
.qform{display:flex;flex-direction:column;gap:8px}
.qform textarea,.qform input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
.send{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.chair h3{font-size:15px;font-family:var(--f-body);font-weight:700;margin:14px 0 4px;color:var(--water)}
.cq{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--surface-2);margin-top:8px}
.cq p{margin:0;font-size:19px;line-height:1.35;font-weight:600}
.cq small{color:var(--muted);font-size:12px}
.cq.read{opacity:.45}
.cq button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.cq.read button{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px}
.signas{font-size:13px;color:var(--muted)} .signas b{color:var(--ink)}
.linkb{border:0;background:none;padding:0;color:var(--water);font-weight:700;text-decoration:underline;font-size:13px}
.now{border:0;width:100%;text-align:left;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--water)}
.now.brk{border-left-color:var(--warn)}
.now .lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--water)}
.now.brk .lbl{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.now h2{font-size:18px}
.now .who{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--water);border-radius:6px}
.now.brk .bar i{background:var(--warn)}
.left{font-family:var(--f-display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.next{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.next b{font-weight:700}
.sim{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:8px 10px}
.sim .r{display:flex;gap:8px;align-items:center}
.sim input[type=range]{flex:1;min-width:0;accent-color:var(--water)}
.sim select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:3px 4px}
.sim b{color:var(--ink);font-variant-numeric:tabular-nums}
.talk.live{box-shadow:0 0 0 2px var(--water),var(--shadow)}
.livechip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--water);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.det{margin:8px 0 0;padding:8px 10px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.det li::before{content:"·";margin-right:6px;color:var(--warn);font-weight:800}
.now .det{background:var(--surface-2)}
.today{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.today .d{font-weight:700;font-size:15px}
.today .sv{font-size:13px;color:var(--muted)} .today .sv b{color:var(--ink)}
.today .clk{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
.wx div{text-align:center;font-size:12px;color:var(--muted)} .wx b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.wx .ic{font-size:11px;color:var(--water);font-weight:700}
.wxnote{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.album h2{font-size:17px}
.album .sub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden}
.ph{border:0;padding:0;aspect-ratio:1;max-width:100%;position:relative;display:grid;place-items:center;color:var(--ink);font-size:11px;font-weight:700;text-align:center}
.ph svg{display:none}
.ph span{position:absolute;left:6px;right:6px;bottom:5px;text-align:left;font-weight:600;font-size:10px;line-height:1.2;color:var(--ink);background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:4px;padding:1px 4px;width:max-content;max-width:calc(100% - 12px)}
.lb{position:fixed;inset:0;z-index:40;background:#0b0f0c;color:#f1f4f1;display:flex;flex-direction:column}
.lb .bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.lb .bar b{flex:1;font-size:14px;font-weight:600;min-width:0}
.lb button{border:0;background:rgba(255,255,255,.12);color:#f1f4f1;border-radius:99px;width:40px;height:40px;font-size:20px;flex:none}
.lb .stage{flex:1;display:grid;place-items:center;padding:0 12px;min-height:0;position:relative;touch-action:pan-y}
.lb .img{width:min(100%,900px);aspect-ratio:4/3;max-height:100%;border-radius:12px;display:grid;place-items:center;font-size:14px;color:rgba(255,255,255,.8);text-align:center;padding:16px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{left:14px} .lb .next{right:14px}
.lb .cap{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:14px;text-align:center;color:#c9d3cb}
@media (min-width: 820px){.photos{grid-template-columns:repeat(6,1fr)}}
.lg{background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;width:68px;height:30px;padding:3px 5px;border:1px solid #eee;overflow:hidden}
.lg img{display:block;width:auto;height:auto;max-width:100%;max-height:22px;object-fit:contain}
.lg.big{width:160px;height:66px;padding:6px 10px;border-radius:12px}
.lg.big img{max-height:52px}
.logo .lg{width:100%;height:58px;padding:6px 8px;border:0}
.logo .lg img{max-height:46px}
.g2 .logo .lg{height:76px}
.g2 .logo .lg img{max-height:62px}
.ticker .lg{width:auto;height:30px;padding:3px 6px;border:0}

function novych(id){return Math.max(0,(S.qa[id]||[]).length-(S.seen[id]||0))}
function novychDen(d){return PROG[d].reduce((a,x)=>a+(x.id?novych(x.id):0),0)}
function novychVse(){return Object.keys(PROG).reduce((a,d)=>a+novychDen(d),0)}
function badge(n){return n?`<span class="bdg" aria-label="${n} ${n===1?"nový dotaz":n<5?"nové dotazy":"nových dotazů"}">${n>9?"9+":n}</span>`:""}
function videno(id){S.seen[id]=(S.qa[id]||[]).length;store.set("seen",S.seen)}
function noveDotazy(stare){for(const id in S.qa){const st=new Set((stare[id]||[]).map(q=>q.k));const cizi=(S.qa[id]||[]).filter(q=>!st.has(q.k)&&q.dev!==DEV);
  if(cizi.length){const x=ALLT.find(y=>y.id===id);if(x)toast("Nový dotaz k přednášce: "+x.h)}}liveRefresh()}
Object.keys(S.qa).forEach(id=>S.qa[id].forEach((q,i)=>{if(!q.k)q.k="d"+i}));   // ukázková data: klíč = pořadí
function podpis(){return [S.me.jm,S.me.firma].filter(Boolean).join(", ")}
function qk(id,k){return (S.qa[id]||[]).find(q=>q.k===k)}
function hlasoval(id,k){return LIVE.on?!!(((LIVE.v[id]||{})[k]||{})[DEV]):!!S.voted[id+":"+k]}
function votes(id,k){const q=qk(id,k);if(!q)return 1;return 1+(LIVE.on?Object.keys((LIVE.v[id]||{})[k]||{}).length:(q.v||0)+(S.voted[id+":"+k]?1:0))}

// Číst může každý, přidat dotaz každý (nemůže ho ale měnit), mazat jen pořadatel. Bez připojení běží ukázková data.
const QDB=window.QDB_URL||"https://moje-budky-default-rtdb.firebaseio.com/konference2027_dotazy/";   // QDB_URL jen pro testy

function treeSet(root,path,data,patch){
 const ks=path.split("/").filter(Boolean);if(!ks.length){if(patch){for(const k in data)root[k]=data[k];return root}return data||{}}
 let o=root;ks.slice(0,-1).forEach(k=>{if(typeof o[k]!=="object"||!o[k])o[k]={};o=o[k]});const last=ks[ks.length-1];
 if(patch){o[last]=o[last]||{};for(const k in data){if(data[k]==null)delete o[last][k];else o[last][k]=data[k]}}else if(data==null)delete o[last];else o[last]=data;
 return root;
}
function liveStart(){
 if(!window.EventSource||!window.fetch)return;
 const pending={q:false,v:false};
 ["q","v"].forEach(kind=>{
  let es;try{es=new EventSource(QDB+kind+".json")}catch(e){return}
  LIVE.es.push(es);
  const on=ev=>{let d;try{d=JSON.parse(ev.data)}catch(e){return}if(!d)return;
   LIVE[kind]=treeSet(LIVE[kind],d.path,d.data,ev.type==="patch");
   if(kind==="q"){if(!LIVE.on){LIVE.on=true;S.voted={};}liveRebuild()}else liveRefresh()};
  es.addEventListener("put",on);es.addEventListener("patch",on);
  es.addEventListener("cancel",()=>{es.close()});
 });
}
function liveRebuild(){
 const stare=S.qa, nove={};
 for(const id in LIVE.q){const o=LIVE.q[id]||{};nove[id]=Object.keys(o).map(k=>Object.assign({k},o[k])).filter(q=>q&&q.t).sort((a,b)=>(a.ts||0)-(b.ts||0))}
 S.qa=nove;
 if(liveRebuild.hotovo)noveDotazy(stare);else{liveRebuild.hotovo=true;liveRefresh()}
}
function liveRefresh(){render();if(SHEET_DRAW&&!$("sheet").hidden)SHEET_DRAW()}

function qPut(path,val){return fetch(QDB+path+".json",{method:val===null?"DELETE":"PUT",body:val===null?undefined:JSON.stringify(val)}).then(r=>{if(!r.ok)throw new Error(r.status);return r})}
function audioDotazu(q){
 if(!q||!q.au)return Promise.reject();if(typeof q.au==="string")return Promise.resolve(q.au);
 if(LIVE.au[q.k])return Promise.resolve(LIVE.au[q.k]);
 return fetch(QDB+"au/"+q.k+".json").then(r=>r.json()).then(u=>{if(!u)throw 0;LIVE.au[q.k]=u;return u});
}

let LB=null;
function openLb(aid,i){LB={a:ALBA.find(x=>x.id===aid),i};drawLb()}
function drawLb(){
 let el=document.getElementById("lb");if(!el){el=document.createElement("div");el.id="lb";el.className="lb";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);
  el.addEventListener("click",e=>{if(e.target.closest("[data-lbx]"))closeLb();else if(e.target.closest("[data-lbp]"))stepLb(-1);else if(e.target.closest("[data-lbn]"))stepLb(1)});
  let x0=null;el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});el.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)stepLb(dx<0?1:-1);x0=null})}
 const {a,i}=LB;
 el.innerHTML=`<div class="bar"><b>${esc(a.h)} · ${i+1} / ${a.n}</b><button data-lbx aria-label="Zavřít">×</button></div>
  <div class="stage"><div class="img" style="${phStyle(a,i)}">Zde bude fotografie<br>„${esc(a.cap[i])}“</div>
  <button class="nav prev" data-lbp aria-label="Předchozí">‹</button><button class="nav next" data-lbn aria-label="Další">›</button></div>
  <div class="cap">${esc(a.cap[i])}</div>`;
 el.querySelector("[data-lbx]").focus();
}
function stepLb(d){if(!LB)return;LB.i=(LB.i+d+LB.a.n)%LB.a.n;drawLb()}
function closeLb(){const el=document.getElementById("lb");if(el)el.remove();LB=null}
document.addEventListener("keydown",e=>{if(!LB)return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")stepLb(-1);if(e.key==="ArrowRight")stepLb(1)});

function sheetQ(id){

  $("qlist").innerHTML=l.length?`<div class="label" style="margin-bottom:2px">Dotazy ostatních – než napíšete, podívejte se, jestli tu už váš není</div>`+l.map(q=>{const on=hlasoval(id,q.k),n=votes(id,q.k),muj=q.dev&&q.dev===DEV;
   return `<div class="q"><div><p>${esc(q.t)}</p>${q.au?`<button type="button" class="linkb" data-qplay="${esc(q.k)}">🔊 Poslechnout nahrávku</button>`:""}<small>${esc(q.a)} · ${esc(q.c)} · ${n} ${n===1?"člověk":n<5?"lidé":"lidí"}</small></div>${muj?'<span class="muted" style="font-size:12px">váš dotaz</span>':`<button class="plus" data-plus="${esc(q.k)}" aria-pressed="${on}">${on?"✓ Mám taky":"+1 Mám stejný"}</button>`}</div>`}).join(""):'<p class="muted" style="margin:0">Zatím žádný dotaz. Buďte první.</p>'};

   <button class="send">Odeslat dotaz</button></form>

 draw();
 let AU=null;   // namluvený dotaz (data: URL)

/* ===== Namluvený dotaz: nahrání (max 60 s) a přehrání do sálu ===== */
const REC={mr:null,t:null,start:0,sr:null};
// Přepis řeči na text (Chrome/Android, Safari/iPhone; posílá zvuk rozpoznávací službě prohlížeče). Když není, zůstane jen nahrávka.
function prepis(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition, ta=$("qt");if(!SR||!ta)return null;
 const r=new SR();r.lang="cs-CZ";r.continuous=true;r.interimResults=true;
 const zaklad=ta.value.trim()?ta.value.trim()+" ":"";let fin="";
 r.onresult=e=>{let mez="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+" ";else mez+=t}
  ta.value=(zaklad+fin+mez).replace(/\s+/g," ").replace(/^./,c=>c.toUpperCase());};
 r.onerror=()=>{};r.onend=()=>{if(REC.mr&&REC.sr===r){try{r.start()}catch(e){}}};   // Android po pauze končí – pokračovat
 try{r.start()}catch(e){return null}return r;
}
function nahravej(hotovo){
 const b=$("qmic"), info=$("qrec");
 if(REC.mr){REC.mr.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Tento prohlížeč neumí nahrávat – napište dotaz textem");
 navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(st=>{
  const typ=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(st,Object.assign({audioBitsPerSecond:24000},typ?{mimeType:typ}:{})), ch=[];REC.mr=mr;REC.start=Date.now();
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(REC.t);REC.mr=null;const sr=REC.sr;REC.sr=null;if(sr)try{sr.stop()}catch(e){}b.textContent="🎤 Namluvit znovu";b.classList.remove("on");info.textContent="";
   const bl=new Blob(ch,{type:mr.mimeType||typ||"audio/webm"});const fr=new FileReader();fr.onload=()=>hotovo(fr.result);fr.readAsDataURL(bl)};
  mr.start();REC.sr=prepis();b.textContent="⏹ Hotovo – ukončit";b.classList.add("on");
  REC.t=setInterval(()=>{const sec=Math.floor((Date.now()-REC.start)/1000);info.textContent=(REC.sr?"● nahrávám a přepisuji ":"● nahrávám ")+Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+" / 1:00";if(sec>=60)mr.stop()},250);
 }).catch(()=>toast("Bez povolení mikrofonu to nejde – povolte ho v prohlížeči"));
}
let HR=null;
function prehraj(q,btn,popis){
 popis=popis||"▶ Přehrát do sálu";
 if(HR){HR.pause();const was=HR.btn;HR=null;document.querySelectorAll("[data-play],[data-qplay]").forEach(x=>x.textContent=x.dataset.qplay?"🔊 Poslechnout nahrávku":"▶ Přehrát do sálu");if(was===btn)return}
 if(!q||!q.au)return;btn.textContent="Načítám…";
 audioDotazu(q).then(u=>{const a=new Audio(u);HR=a;a.btn=btn;btn.textContent="⏸ Zastavit";
  a.onended=()=>{btn.textContent=popis.replace("Přehrát do sálu","Přehrát znovu");HR=null};return a.play()})
  .catch(()=>{btn.textContent=popis;HR=null;toast("Nahrávku se nepodařilo přehrát")});
}

 openSheet(`<h2>Pohled předsedajícího</h2><div class="muted" style="font-size:13px;margin-top:2px">${esc(bk.blok)} · předsedá ${esc(bk.pr)}</div>

}

/* ===== Export poznámek ===== */
function mojePoznamky(){return ALLT.filter(x=>x.id&&S.notes[x.id]).map(x=>{const d=Object.keys(PROG).find(k=>PROG[k].includes(x));return {x,den:DAYS.find(z=>z.k===d)}})}
function poznamkyText(){
 const l=mojePoznamky();
 return "Moje poznámky – Nové metody a postupy při provozování ČOV, 31. ročník ("+TERMIN+")\n"+(podpis()?podpis()+"\n":"")+"\n"+
  l.map(({x,den})=>`${den.n} ${den.d} · ${x.t}${x.e?"–"+x.e:""}\n${x.h}\n${x.w}\n\n${S.notes[x.id]}\n`).join("\n----------------------------------------\n\n");
}
function tiskPoznamek(){
 const l=mojePoznamky(), pa=$("printarea");
 pa.innerHTML=`<h1>Moje poznámky</h1><div class="m">Nové metody a postupy při provozování ČOV · 31. ročník · ${esc(TERMIN)}${podpis()?" · "+esc(podpis()):""}</div>`+
  l.map(({x,den})=>`<div class="n"><b>${esc(x.h)}</b><div class="w">${esc(den.n)} ${esc(den.d)} · ${esc(x.t)}${x.e?"–"+esc(x.e):""} · ${esc(x.w)}</div><p>${esc(S.notes[x.id])}</p></div>`).join("");
 document.body.classList.add("tisk");
 const done=()=>{document.body.classList.remove("tisk");window.removeEventListener("afterprint",done)};
 window.addEventListener("afterprint",done);
 try{window.print()}catch(e){}
 setTimeout(()=>{if(document.body.classList.contains("tisk")){done();toast("Tisk tady není dostupný – na webu aplikace funguje")}},1500);
}
function stahniPoznamky(){
 const b=new Blob(["\ufeff"+poznamkyText()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="moje-poznamky-konference-2027.txt";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function mailPoznamky(){
 const t=poznamkyText();location.href="mailto:?subject="+encodeURIComponent("Moje poznámky – konference ČOV 2027")+"&body="+encodeURIComponent(t.length>1800?t.slice(0,1800)+"\n…(zkráceno, celé poznámky si stáhněte jako text)":t);
}

/* ===== Upozornění na přednášku ===== */
function talkDay(x){return Object.keys(PROG).find(k=>PROG[k].includes(x))}
// časy programu jsou pražské (v dubnu letní čas = UTC+2) – nezávisle na nastavení zařízení
function talkStart(x){const d=talkDay(x);const [y,mo,da]=DATES[d].split("-").map(Number);return new Date(Date.UTC(y,mo-1,da,Math.floor(x.a/60),x.a%60)-2*3600e3)}
let AC=null;
function pip(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 [0,0.35,0.7].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1046:880;o.connect(g);g.connect(AC.destination);
  const t0=AC.currentTime+t;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.4,t0+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);o.start(t0);o.stop(t0+0.32)})}catch(e){}}
function sheetAlarm(id){
 const x=ALLT.find(y=>y.id===id), cur=S.alarms[id]||{m:10,zvuk:true,notif:false};
 const den=DAYS.find(d=>d.k===talkDay(x));
 openSheet(`<h2>Upozornit na přednášku</h2><div class="muted" style="font-size:13px;margin-top:2px">${esc(den.n)} ${esc(den.d)} · ${esc(x.t)} · ${esc(x.h)}</div>
  <div class="bd">
   <div><div class="label" style="margin-bottom:6px">Kolik minut předem mě upozornit</div><div class="days" id="am" role="group" style="grid-template-columns:repeat(4,1fr)">${[5,10,15,30].map(m=>`<button data-m="${m}" aria-pressed="${cur.m===m}">${m} min</button>`).join("")}</div>
    <label class="amv">nebo vlastní: <input id="amin" type="number" min="1" max="240" inputmode="numeric" value="${[5,10,15,30].includes(cur.m)?"":cur.m}" placeholder="např. 20"> minut předem</label></div>
   <div><div class="label" style="margin-bottom:6px">Jak mě upozornit</div><div class="how">
    <label><input type="checkbox" id="az" ${cur.zvuk!==false?"checked":""}><span><b>Zvuk a vibrace</b><small>Zazvoní a zavibruje, když máte průvodce otevřený – třeba v sále nebo na chodbě.</small></span></label>
    <label><input type="checkbox" id="an" ${cur.notif?"checked":""}><span><b>Upozornění v telefonu</b><small>Oznámení na obrazovce, i když je průvodce na pozadí. Telefon se zeptá na povolení.</small></span></label>
    <div class="note" style="margin:0"><b>Nejspolehlivější:</b> uložte si přednášku do kalendáře v mobilu – připomene se i při zavřeném průvodci.<br><button class="btn" id="aics" style="margin-top:8px">📅 Přidat do kalendáře s připomenutím</button></div>
   </div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="send" id="asave" style="flex:1">Nastavit upozornění</button>${S.alarms[id]?'<button class="btn" id="adel">Zrušit upozornění</button>':""}<button class="btn" id="atest">Vyzkoušet</button></div>
  </div>`);
 let m=cur.m;
 $("am").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;m=+b.dataset.m;$("amin").value="";$("am").querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b))});
 $("amin").addEventListener("input",()=>{const v=Math.round(+$("amin").value);if(v>=1&&v<=240){m=v;$("am").querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",+z.dataset.m===v))}});
 $("an").addEventListener("change",async()=>{if($("an").checked&&"Notification" in window&&Notification.permission!=="granted"){try{const r=await Notification.requestPermission();if(r!=="granted"){$("an").checked=false;toast("Upozornění nejsou povolená – zůstane zvuk a kalendář")}}catch(e){$("an").checked=false}}
   else if($("an").checked&&!("Notification" in window)){$("an").checked=false;toast("Tento prohlížeč upozornění nepodporuje")}});
 $("asave").addEventListener("click",()=>{pip();S.alarms[id]={m,zvuk:$("az").checked,notif:$("an").checked};delete S.fired[id];store.set("alarms",S.alarms);store.set("fired",S.fired);closeSheet();render();
   toast(`Upozorním vás ${m} min před začátkem (${x.t})`)});
 const d=$("adel");if(d)d.addEventListener("click",()=>{delete S.alarms[id];store.set("alarms",S.alarms);closeSheet();render();toast("Upozornění zrušeno")});
 $("atest").addEventListener("click",()=>{closeSheet();zazvon(x,m,{zvuk:$("az").checked,notif:$("an").checked},true)});
 $("aics").addEventListener("click",()=>ics(x,m));
}
function ics(x,m){
 const st=talkStart(x), en=new Date(st.getTime()+((x.b??x.a+30)-x.a)*60000), f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
 const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//VHOS//Konference CZ//CS","BEGIN:VEVENT","UID:"+x.id+"-2027@konference-vhos","DTSTAMP:"+f(new Date()),"DTSTART:"+f(st),"DTEND:"+f(en),
  "SUMMARY:"+x.h.replace(/[,;]/g,"\\$&"),"LOCATION:Kongres hotel Jezerka\\, Seč","DESCRIPTION:"+x.w.replace(/[,;]/g,"\\$&"),
  "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Začíná přednáška","TRIGGER:-PT"+m+"M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar;charset=utf-8"}));a.download="prednaska-"+x.t.replace(":","")+".ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
 toast("Otevřete stažený soubor – přidá se do kalendáře");
}
function zazvon(x,m,how,test){
 if(how.zvuk!==false){pip();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,600])}catch(e){}}
 if(how.notif&&"Notification" in window&&Notification.permission==="granted"){
  const t=(test?"Zkouška: ":"")+"Za "+m+" min začíná přednáška", o={body:x.t+" · "+x.h,icon:IMG+"cislo31.webp",tag:x.id};
  (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>{if(r)r.showNotification(t,o);else new Notification(t,o)}).catch(()=>{try{new Notification(t,o)}catch(e){}});
 }
 const el=document.createElement("div");el.className="alarm";el.setAttribute("role","alertdialog");
 el.innerHTML=`<div class="box"><img src="${IMG}cislo31.webp" alt=""><div class="label">${test?"Zkouška upozornění":"Upozornění"}</div><div class="big">Za ${m} min začíná</div><div><b>${esc(x.h)}</b><div class="muted" style="font-size:13px;margin-top:4px">${esc(x.t)} · ${esc(x.w)}</div></div><button class="send" id="aok">Rozumím</button></div>`;
 document.body.appendChild(el);el.querySelector("#aok").focus();el.querySelector("#aok").addEventListener("click",()=>el.remove());
}
function kontrolaBudiku(){
 const now=Date.now();
 for(const [id,a] of Object.entries(S.alarms)){
  if(S.fired[id])continue;const x=ALLT.find(y=>y.id===id);if(!x||x.a==null)continue;
  const st=talkStart(x).getTime(), at=st-a.m*60000;
  if(now>=at&&now<st){S.fired[id]=1;store.set("fired",S.fired);zazvon(x,Math.max(1,Math.round((st-now)/60000)),a,false)}
 }
}
setInterval(kontrolaBudiku,20000);setTimeout(kontrolaBudiku,1500);
if(window.IMGBASE&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}

/* ===== Sheet ===== */
function openSheet(h){const s=$("sheet");s.innerHTML=`<div class="grab"></div><button class="close" id="sclose" aria-label="Zavřít">×</button>`+h;s.hidden=false;$("bd").hidden=false;$("sclose").focus()}
function closeSheet(){SHEET_DRAW=null;if(REC.mr)REC.mr.stop();if(HR){HR.pause();HR=null}$("sheet").hidden=true;$("bd").hidden=true}
$("bd").addEventListener("click",closeSheet);
$("sheet").addEventListener("click",e=>{if(e.target.id==="sclose")return closeSheet();if(e.target.closest("[data-profil]")){closeSheet();return go("info")}const g=e.target.closest("[data-goday]");if(g){closeSheet();S.day=g.dataset.goday;S.q="";S.mine=false;go("program")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});

/* ===== Události ===== */
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab)});
$("view").addEventListener("click",e=>{
 const sg=e.target.closest("[data-stg]");if(sg)return stgGo(+sg.dataset.stg,true);
 if(e.target.closest("[data-wx]"))return sheetWx();
 if(e.target.closest("[data-kal]"))return sheetKal();
 if(e.target.closest("[data-nav]"))return sheetNav();
 const t=e.target.closest("[data-go],[data-day],[data-note],[data-alarm],[data-p],[data-q],[data-chair],[data-ph],#mine,#npr,#ntxt,#nmail");if(!t)return;
 if(t.dataset.alarm)return sheetAlarm(t.dataset.alarm);
 if(t.dataset.ph){const [a,i]=t.dataset.ph.split(":");return openLb(a,+i)}
 if(t.dataset.q)return sheetQ(t.dataset.q);
 if(t.dataset.chair)return sheetChair(t.dataset.chair);
 if(t.dataset.go){if(t.dataset.mine)S.mine=true;return go(t.dataset.go)}
 if(t.dataset.day){S.day=t.dataset.day;return render()}
 if(t.dataset.note)return sheetNote(t.dataset.note);
 if(t.dataset.p)return sheetP(t.dataset.p);
 if(t.id==="mine"){S.mine=!S.mine;return render()}
 if(t.id==="npr")return tiskPoznamek();
 if(t.id==="ntxt")return stahniPoznamky();
 if(t.id==="nmail")return mailPoznamky();
});
$("view").addEventListener("change",e=>{if(e.target.id==="simday"){S.sim.day=e.target.value;$("nowbox").outerHTML=vNow()}});
$("view").addEventListener("click",e=>{const g=e.target.closest(".now[data-goday]");if(g){S.day=g.dataset.goday;S.q="";S.mine=false;go("program");const l=document.querySelector(".talk.live");if(l)l.scrollIntoView({block:"center"})}});
setInterval(()=>{if(clock().real)render()},30000);
$("view").addEventListener("submit",e=>{if(e.target.id!=="pf")return;e.preventDefault();S.me={jm:$("pjm").value.trim(),firma:$("pfirma").value.trim()};store.set("me",S.me);render();toast(podpis()?"Profil uložen":"Profil je prázdný")});
$("view").addEventListener("click",e=>{
 if(e.target.id==="kdemo")return kartaNacti("ukazka");
 if(e.target.id==="kodhl"){if(confirm("Odebrat registraci z tohoto telefonu? Znovu ji načtete odkazem z e-mailu.")){S.karta=null;store.set("karta",null);render();toast("Odebráno")}}});
$("view").addEventListener("submit",e=>{if(e.target.id!=="kf")return;e.preventDefault();const k=kartaKlic($("kin").value);if(!k)return toast("To nevypadá jako odkaz z e-mailu");kartaNacti(k)});
$("view").addEventListener("click",e=>{if(e.target.id==="pdel"){S.me={jm:"",firma:""};store.set("me",S.me);render();toast("Profil smazán")}});
$("view").addEventListener("input",e=>{
 if(e.target.id==="simm"){S.sim.m=+e.target.value;$("nowbox").outerHTML=vNow();$("simm").focus();return}if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("q");q.focus();q.setSelectionRange(pos,pos)}});
(function(){try{const k=new URLSearchParams(location.search).get("k");
 if(k){history.replaceState(null,"",location.pathname+location.hash);kartaNacti(kartaKlic(k))}else if(S.karta)kartaNacti(null,true)}catch(e){}})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.karta&&S.karta.k!=="ukazka"&&Date.now()-S.karta.ts>120000)kartaNacti(null,true)});
liveStart();
document.getElementById("markimg").src=IMG+"cislo31.webp";
document.getElementById("vchip").textContent="Ukázka · v"+VERZE.split(" ")[0];
render();
</script>
